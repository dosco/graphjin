query daily_schedule_context {
  appointments(
    where: { status: { eq: "scheduled" } }
    order_by: { scheduled_at: asc }
    limit: 20
  ) {
    id
    patient_id
    provider_id
    room_id
    scheduled_at
    duration_minutes
    status
  }
  providers(order_by: { id: asc }, limit: 10) {
    id
    name
    specialty
  }
  rooms(order_by: { id: asc }, limit: 10) {
    id
    name
    kind
  }
}
