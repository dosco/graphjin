# DeepORG reference watches
#
# Run each mutation through GraphiQL or the governed agent after starting the
# demo. They are intentionally ordinary gj_watch definitions: the benchmark
# uses the same public control-plane contract rather than a private fixture.

mutation ReferenceFailedInvoices {
  gj_watch(
    insert: {
      name: "saas_ops_failed_invoices"
      description: "Alert when a failed invoice changes."
      query: "subscription saas_ops_failed_invoices { invoices(where: {status: {eq: \"failed\"}}, first: 25, after: $cursor) { id account_id status attempts last_attempt_at } invoices_cursor }"
    }
  ) {
    id
    name
    status
    enabled
  }
}

mutation ReferenceUrgentTickets {
  gj_watch(
    insert: {
      name: "saas_ops_urgent_tickets"
      description: "Alert when an open urgent support ticket changes."
      query: "subscription saas_ops_urgent_tickets { support_tickets(where: {status: {eq: \"open\"}, severity: {eq: \"urgent\"}}, first: 25, after: $cursor) { id account_id status severity sla_due_at } support_tickets_cursor }"
    }
  ) {
    id
    name
    status
    enabled
  }
}

mutation ReferenceChurnRiskAccounts {
  gj_watch(
    insert: {
      name: "saas_ops_churn_risk_accounts"
      description: "Alert when a churn-risk account changes."
      query: "subscription saas_ops_churn_risk_accounts { accounts(where: {status: {eq: \"churn_risk\"}}, first: 25, after: $cursor) { id name status renewal_date mrr_cents } accounts_cursor }"
    }
  ) {
    id
    name
    status
    enabled
  }
}
