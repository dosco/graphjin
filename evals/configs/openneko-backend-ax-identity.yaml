schema_version: openneko.eval/v1
id: openneko-backend-ax-identity
description: Single-episode Ax identity, sandbox-provider, MCP, and allowed API mutation canary.
adapter: openneko.work-backend
semantics: { ref: ../semantics.yaml }
pricing: { ref: ../pricing/standard-2026-07-09.yaml }
suite:
  ref: ../suites/openneko-backend-v1.yaml
  cases: [b00-api-selection]
datasets:
  - ref: ../datasets/openneko-backend/dataset.yaml
    snapshot: v1
defaults:
  repetitions: 1
  timeout: 12m
  execution_order: declared
  concurrency: 1
  cache_state: cold
  content_capture: metadata
  max_attempts: 1
variants:
  - id: ax-gemini-parity
    backend: ax
    outer_model:
      provider: google-gemini
      model: gemini-3.6-flash
      credential_ref: env:GEMINI_API_KEY
    data_path: graphjin-direct
    settings:
      native_delegation: disabled
      cards: disabled
      require_observed_model_identity: true
      max_tool_calls: 30
budgets:
  max_wall_time: 30m
  max_estimated_cost_usd: 2
artifacts:
  check_in: none
  raw_dir: ../../.openneko/evals/raw
  state_dir: ../../.openneko/evals/state
  results_dir: ../../evals/results
