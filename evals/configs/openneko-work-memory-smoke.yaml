schema_version: openneko.eval/v1
id: openneko-work-memory-smoke
description: Deterministic product-path eval for seeded-memory retrieval,
  memory lifecycle and tenant isolation, memory-capability ablation, and
  skill install/round-trip contracts.
adapter: openneko.work-memory
semantics: { ref: ../semantics.yaml }
suite: { ref: ../suites/openneko-work-memory-smoke.yaml }
datasets:
  - ref: ../datasets/openneko-work/dataset.yaml
    snapshot: v1
defaults:
  repetitions: 1
  timeout: 2m
  execution_order: declared
  concurrency: 1
  cache_state: cold
  content_capture: metadata
  max_attempts: 2
variants:
  - id: deterministic-product-runtime
    backend: ax
    outer_model:
      provider: deterministic
      model: no-model-calls
    data_path: none
    settings:
      provisioning: isolated-openneko-test-org
budgets:
  max_wall_time: 5m
artifacts:
  check_in: scored
  raw_dir: .openneko/evals/raw
  state_dir: .openneko/evals/state
  results_dir: evals/results
