schema_version: openneko.eval/v1
id: adventureworks-gemini-model-parity
description: Matched one-pass Gemini 3.6 Flash and Gemini 3.5 Flash-Lite comparison across the full AdventureWorks metric corpus.
adapter: adventureworks.metric
semantics:
  ref: ../semantics.yaml
pricing:
  ref: ../pricing/standard-2026-07-09.yaml

suite:
  ref: ../suites/adventureworks-metric-20q.yaml

datasets:
  - ref: ../datasets/adventureworks/dataset.yaml
    snapshot: full

defaults:
  repetitions: 1
  timeout: 10m
  execution_order: counterbalanced
  concurrency: 1
  cache_state: warm
  content_capture: metadata
  max_attempts: 2

variants:
  - id: ax-gemini-3.6-flash-direct
    backend: ax
    outer_model:
      provider: google-gemini
      model: gemini-3.6-flash
      credential_ref: env:GEMINI_API_KEY
    data_path: graphjin-direct

  - id: ax-gemini-3.5-flash-lite-direct
    backend: ax
    outer_model:
      provider: google-gemini
      model: gemini-3.5-flash-lite
      credential_ref: env:GEMINI_API_KEY
    data_path: graphjin-direct

budgets:
  max_wall_time: 6h
  max_estimated_cost_usd: 25

artifacts:
  check_in: scored
  raw_dir: .openneko/evals/raw
  state_dir: .openneko/evals/state
  results_dir: evals/results
