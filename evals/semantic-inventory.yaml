schema_version: openneko.eval.semantic-inventory/v1

# Exact code-owned inventories. Repository verification fails when code adds or
# removes an item without assigning it at least one semantic owner here.
agent_events:
  message: [OUTPUT-MESSAGE]
  interim: [OUTPUT-MESSAGE, RUNTIME-STREAM]
  progress: [OUTPUT-MESSAGE, RUNTIME-STREAM]
  tool_start: [RUNTIME-STREAM]
  tool_delta: [RUNTIME-STREAM]
  tool_end: [RUNTIME-STREAM]
  surface: [OUTPUT-SURFACE]
  artifact: [OUTPUT-ARTIFACT]
  status: [RUNTIME-STREAM]
  usage: [RUNTIME-OBSERVABILITY]
  telemetry: [RUNTIME-OBSERVABILITY]
  error: [RUNTIME-STREAM, OPS-HEALTH]
  retry: [RUNTIME-STREAM, OPS-HEALTH]
  capability_denied: [SEC-EGRESS]
  done: [RUNTIME-STREAM]
  output_emit: [FLOW-OUTPUT]
  action_request_emit: [ACTION-PROPOSE]
  action_request_result: [ACTION-EXECUTE, ACTION-AUDIT]
  needs_input: [OUTPUT-NEEDS-INPUT]
  followups: [OUTPUT-FOLLOWUPS]
  vitals: [OUTPUT-VITALS]
  skill_used: [WORK-SKILLS]

worker_queues:
  business_profile_build: [ONBOARD-PROFILE]
  industry_insights_build: [ONBOARD-RESEARCH]
  bootstrap_metrics_build: [ONBOARD-BOOTSTRAP]
  metric_refresh: [METRIC-REFRESH]
  metric_refresh_scheduled_sweep: [METRIC-REFRESH]
  work_run: [RUNTIME-INGRESS, WORK-THREAD]
  workflow_cron_sweep: [FLOW-CRON]
  workflow_run_fire: [FLOW-RUN]
  workflow_output_ttl_sweep: [FLOW-OUTPUT-TTL]
  bot_name_sweep: [WORK-THREAD]
  action_execute: [ACTION-EXECUTE, ACTION-IDEMPOTENCY]
  records_import: [RECORDS-IMPORT]
  records_identity_link: [RECORDS-IDENTITY]
  records_salesforce_export: [RECORDS-CONNECT]
  records_salesforce_sync: [RECORDS-CONNECT]
  records_salesforce_sync_sweep: [RECORDS-CONNECT]
  records_salesforce_cutover: [RECORDS-CONNECT]
  records_backup_verify: [OPS-BACKUP]
  records_ops_watch: [RECORDS-OPS]
  records_watch_evaluate: [RECORDS-WATCH]
  records_watch_sweep: [RECORDS-WATCH]
  channel_deliver: [CHANNEL-DELIVERY]
  library_extract: [LIBRARY-DISTILL]
  library_distill: [LIBRARY-DISTILL, LIBRARY-LAYERS]
  embedding_index: [WORK-MEMORY-SEARCH, WORK-LIBRARY-SEARCH]
  embedding_sweep: [WORK-MEMORY-SEARCH, WORK-LIBRARY-SEARCH]
  skill_learn: [WORK-SKILLS]
  directory_sync: [ADMIN-USER, PLUGIN-AUTH]

observation_kinds:
  run.start: [RUNTIME-OBSERVABILITY]
  run.first_output: [RUNTIME-OBSERVABILITY]
  run.end: [RUNTIME-OBSERVABILITY]
  stage.start: [RUNTIME-OBSERVABILITY]
  stage.end: [RUNTIME-OBSERVABILITY]
  model.request: [RUNTIME-MODEL-RESOLUTION, RUNTIME-OBSERVABILITY]
  model.first_chunk: [RUNTIME-OBSERVABILITY]
  model.response: [RUNTIME-MODEL-RESOLUTION, RUNTIME-OBSERVABILITY]
  tool.start: [RUNTIME-STREAM, RUNTIME-OBSERVABILITY]
  tool.end: [RUNTIME-STREAM, RUNTIME-OBSERVABILITY]
  delegation.start: [DATA-DELEGATED, RUNTIME-OBSERVABILITY]
  delegation.end: [DATA-DELEGATED, RUNTIME-OBSERVABILITY]
  memory.start: [WORK-MEMORY-SEARCH, RUNTIME-OBSERVABILITY]
  memory.end: [WORK-MEMORY-SEARCH, RUNTIME-OBSERVABILITY]
  policy.decision: [ACTION-POLICY, RUNTIME-OBSERVABILITY]
  approval.decision: [ACTION-APPROVAL, RUNTIME-OBSERVABILITY]
  validation.result: [RUNTIME-VALIDATE, RUNTIME-OBSERVABILITY]
  retry: [RUNTIME-RETRY, RUNTIME-OBSERVABILITY]
  output.contract: [OUTPUT-SURFACE, RUNTIME-OBSERVABILITY]
  error: [OPS-HEALTH, RUNTIME-OBSERVABILITY]
