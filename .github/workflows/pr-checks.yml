name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lazy-service:
    name: Lazy service lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false
      - run: go test -race ./...
        working-directory: apps/lazy-service

  embedding-image:
    name: Offline embedding service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: docker build --target embedding -t openneko-embedding:pr .
      - run: docker run --rm --network none --memory 1g --cpus 1 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m --entrypoint node openneko-embedding:pr /app/smoke.mjs

  librarian-image:
    name: Librarian image
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Run owned API contract tests
        run: docker build --target librarian-test -f apps/librarian/Dockerfile .

      - name: Build image with vendored models
        run: docker build --target librarian -t openneko-librarian:pr -f apps/librarian/Dockerfile .

      - name: Verify lazy extraction and idle restart offline
        run: docker run --rm --network none --memory 4g --cpus 1 --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=512m --mount type=volume,target=/var/lib/neko-librarian/results --entrypoint python3 openneko-librarian:pr /app/smoke.py

  release-recovery-contract:
    name: Release recovery contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify failed-to-recovered release transitions
        run: bash scripts/check-release-recovery-contract.sh

  design-system:
    name: Web design system
    runs-on: ubuntu-24.04

    # Solo-mode pages resolve a persisted identity, just like installed instances.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neko
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: neko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENNEKO_PG_ENV_OVERRIDE: "1"
      NEKO_PG_HOST: 127.0.0.1
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: secret
      NEKO_PG_DATABASE: neko
      NEKO_PG_SSLMODE: disable

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce shared UI controls and tokens
        env:
          UI_SYSTEM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-web-design-system.mjs

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/openneko/go.mod
          cache-dependency-path: apps/openneko/go.sum

      - name: Migrate visual-test database
        working-directory: apps/openneko
        run: go run ./cmd/openneko migrate

      - name: Install Chromium
        run: pnpm --filter @neko/web exec playwright install --with-deps chromium

      - name: Verify shared UI layouts, overlays and Magento rendering
        run: pnpm --filter @neko/web test:visual:design

      - name: Upload design-system browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magento-design-system-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: error

  records-recovery:
    name: Records recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Verify backup and database crash recovery
        run: ./scripts/test-records-recovery.sh

  graphjin-integration:
    name: GraphJin integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      records-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: records
          POSTGRES_PASSWORD: records-secret
          POSTGRES_DB: records
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U records"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GRAPHJIN_VERSION: "3.21.16"
      RECORDS_GRAPHJIN_IMAGE: openneko/graphjin-integration:3.21.16
      REQUIRE_GRAPHJIN_INTEGRATION: "1"
      OPENNEKO_PG_ENV_OVERRIDE: "1"
      RECORDS_PG_HOST: localhost
      RECORDS_PG_PORT: "5434"
      RECORDS_PG_USER: records
      RECORDS_PG_PASSWORD: records-secret
      RECORDS_PG_DATABASE: records

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - name: Build the pinned GraphJin runtime
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --target graphjin-runtime \
            --tag "$RECORDS_GRAPHJIN_IMAGE" \
            .
          docker run --rm --entrypoint graphjin \
            "$RECORDS_GRAPHJIN_IMAGE" version | grep -F "$GRAPHJIN_VERSION"

      - name: Validate shipped source-mode configs
        run: |
          for config in customer.sources.example.yml dev.sources.example.yml; do
            docker run --rm --entrypoint graphjin \
              --volume "$PWD/db/graphjin:/config:ro" \
              "$RECORDS_GRAPHJIN_IMAGE" \
              config --file "/config/$config" validate
          done

      - name: Configure GraphJin-to-Postgres routing
        run: |
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$gateway"
          echo "RECORDS_GRAPHJIN_DB_HOST=$gateway" >> "$GITHUB_ENV"

      - name: Run live GraphJin compatibility tests
        run: |
          pnpm --filter @neko/records exec vitest run \
            test/policy-graphjin.integration.test.ts \
            test/schema-graphjin.integration.test.ts \
            test/write-executor.integration.test.ts \
            test/import-executor.integration.test.ts \
            --no-file-parallelism

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neko
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: neko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/openneko/go.sum

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - name: Install graphjin CLI
        env:
          GRAPHJIN_VERSION: "3.21.16"
        run: |
          curl -fsSL -o /tmp/graphjin.tgz \
            "https://github.com/dosco/graphjin/releases/download/v${GRAPHJIN_VERSION}/graphjin_${GRAPHJIN_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/graphjin.tgz -C /usr/local/bin graphjin
          graphjin version


      - name: Verify durable embedding queue
        env:
          PGPASSWORD: secret
          EMBEDDING_TEST_DATABASE_URL: postgres://neko:secret@127.0.0.1:5432/embedding_jobs_test
        run: |
          createdb -h 127.0.0.1 -U neko embedding_jobs_test
          pnpm --filter @neko/worker exec vitest run test/embedding-jobs.test.ts

      - name: Run migrations
        env:
          NEKO_PG_HOST: localhost
          NEKO_PG_PORT: "5432"
          NEKO_PG_USER: neko
          NEKO_PG_PASSWORD: secret
          NEKO_PG_DATABASE: neko
        working-directory: apps/openneko
        run: go run ./cmd/openneko migrate

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Verify eval definitions and checked-in results
        run: |
          pnpm --filter @neko/evals schemas:generate
          pnpm --filter @neko/evals semantics:generate
          git diff --exit-code -- evals/schemas evals/semantics.yaml
          pnpm --filter @neko/evals repo:check

      - name: Build
        run: pnpm -r build

      - name: Test
        env:
          LIBRARY_BROWSE_REQUIRE_DB: "1"
          NEKO_PG_HOST: localhost
          NEKO_PG_PORT: "5432"
          NEKO_PG_USER: neko
          NEKO_PG_PASSWORD: secret
          NEKO_PG_DATABASE: neko
          AGENT_AUTO_MEMORY: "off"
        # apps/web and apps/worker share Postgres; worker's reconciler scans processing_job globally and races with web's onboarding tests.
        run: pnpm -r --workspace-concurrency=1 test
