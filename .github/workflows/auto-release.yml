name: Auto Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  # Manual escape hatch. Build skips workflow-only commits (paths-ignore), so a
  # release-pipeline fix cannot trigger itself, and a failed publish otherwise
  # needs an unrelated commit to retry.
  #
  # With no input it cuts a release from master. With npm_publish_version it runs
  # only the npm-publish job at the bottom of this file.
  workflow_dispatch:
    inputs:
      npm_publish_version:
        description: "Publish only the npm package of a release that is already out, e.g. 3.21.22. Empty: a normal release."
        required: false
        default: ""

concurrency:
  group: auto-release-master
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      # contents: the `gh release delete` step below uses GITHUB_TOKEN.
      # id-token: required for npm trusted publishing (OIDC).
      contents: write
      id-token: write
    if: |
      (github.event_name == 'workflow_dispatch' && !inputs.npm_publish_version) || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip-release]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GR_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # No registry-url: it makes setup-node write an .npmrc containing
          # _authToken=${NODE_AUTH_TOKEN}, and with no token supplied that becomes a
          # literal placeholder. npm then authenticates with garbage instead of
          # falling through to OIDC. Default registry is npmjs.org anyway.
          node-version: '24'

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Determine version increment
        id: version_increment
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || '' }}
        run: |
          # Check commit message for version increment hints
          if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
            INCREMENT_TYPE="major"
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]] || [[ "$COMMIT_MSG" == *"feat:"* ]] || [[ "$COMMIT_MSG" == *"feature:"* ]]; then
            INCREMENT_TYPE="minor"
          else
            INCREMENT_TYPE="patch"
          fi

          echo "increment_type=$INCREMENT_TYPE" >> $GITHUB_OUTPUT
          echo "Version increment type: $INCREMENT_TYPE"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.current }}"
          INCREMENT_TYPE="${{ steps.version_increment.outputs.increment_type }}"
          
          # Split version into parts
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # Increment based on type
          case $INCREMENT_TYPE in
            "major")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch")
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Prepare release target
        id: release_target
        run: |
          set -euo pipefail

          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          WORKFLOW_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          git fetch origin master:refs/remotes/origin/master --tags

          REMOTE_SHA=$(git rev-parse origin/master)
          if [ "$REMOTE_SHA" = "$WORKFLOW_SHA" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "mode=create" >> "$GITHUB_OUTPUT"
            echo "Release target is current master"
            exit 0
          fi

          REMOTE_VERSION=$(git show origin/master:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          REMOTE_SUBJECT=$(git log -1 --pretty=%s origin/master)
          EXPECTED_SUBJECT="chore: bump version to v$NEW_VERSION [skip-release] [skip ci]"

          if [ "$REMOTE_VERSION" = "$NEW_VERSION" ] && [ "$REMOTE_SUBJECT" = "$EXPECTED_SUBJECT" ]; then
            git checkout -B release-target origin/master
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "mode=reuse" >> "$GITHUB_OUTPUT"
            echo "Reusing release commit already on master"
            exit 0
          fi

          echo "should_release=false" >> "$GITHUB_OUTPUT"
          echo "mode=skip" >> "$GITHUB_OUTPUT"
          echo "::notice ::Skipping release because master advanced from $WORKFLOW_SHA to $REMOTE_SHA"
          echo "::notice ::Remote master version is $REMOTE_VERSION; planned version is $NEW_VERSION"

      - name: Update package.json version
        if: steps.release_target.outputs.mode == 'create'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          npm version $NEW_VERSION --no-git-tag-version
          echo "Updated package.json to version $NEW_VERSION"

      - name: Set up Go
        if: steps.release_target.outputs.should_release == 'true'
        uses: actions/setup-go@v4
        with:
          go-version: "1.23.1"

      - name: Cache Go modules
        if: steps.release_target.outputs.should_release == 'true'
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update Go module versions
        if: steps.release_target.outputs.mode == 'create'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          chmod +x ./release.sh
          ./release.sh $NEW_VERSION
          echo "Updated Go modules to version $NEW_VERSION"

      - name: Configure Git
        if: steps.release_target.outputs.mode == 'create'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit version updates
        if: steps.release_target.outputs.mode == 'create'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          git add .
          git commit -m "chore: bump version to v$NEW_VERSION [skip-release] [skip ci]"

      - name: Create and push tags
        id: push_release
        if: steps.release_target.outputs.should_release == 'true'
        run: |
          set -euo pipefail

          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          RELEASE_MODE="${{ steps.release_target.outputs.mode }}"
          WORKFLOW_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          tags=(
            "auth/v$NEW_VERSION"
            "cmd/v$NEW_VERSION"
            "conf/v$NEW_VERSION"
            "core/v$NEW_VERSION"
            "plugin/otel/v$NEW_VERSION"
            "serv/v$NEW_VERSION"
            "tests/v$NEW_VERSION"
            "v$NEW_VERSION"
          )
          tag_refs=()

          # Delete existing local tags if they exist (handles re-runs gracefully).
          for tag in "${tags[@]}"; do
            git tag -d "$tag" 2>/dev/null || true
          done

          # Create all module tags.
          for tag in "${tags[@]}"; do
            git tag "$tag"
            tag_refs+=("refs/tags/$tag")
          done

          if [ "$RELEASE_MODE" = "create" ]; then
            git fetch origin master:refs/remotes/origin/master
            REMOTE_SHA=$(git rev-parse origin/master)
            if [ "$REMOTE_SHA" != "$WORKFLOW_SHA" ]; then
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              echo "::notice ::Skipping release push because master advanced from $WORKFLOW_SHA to $REMOTE_SHA"
              exit 0
            fi

            git push origin HEAD:master
          fi

          # Replace remote release tags only after the branch push is complete.
          for tag in "${tags[@]}"; do
            git push origin ":refs/tags/$tag" 2>/dev/null || true
          done

          git push origin "${tag_refs[@]}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          echo "Created and pushed tags for version $NEW_VERSION"

      - name: Delete existing release if any
        if: steps.push_release.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          gh release delete "v$NEW_VERSION" --yes 2>/dev/null || true

      - name: Import GPG key
        if: steps.push_release.outputs.pushed == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v4
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Login to Docker Hub
        if: steps.push_release.outputs.pushed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        if: steps.push_release.outputs.pushed == 'true'
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GR_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          KO_DOCKER_REPO: dosco/graphjin

      - name: Publish to npm
        if: steps.push_release.outputs.pushed == 'true'
        run: |
          # Trusted publishing (OIDC): the CLI mints a short-lived, workflow-scoped
          # credential, so there is no NPM_TOKEN to leak or rotate. Requires npm >= 11.5
          # and the trusted publisher configured for this repo + workflow on npmjs.com.
          # If only this step fails, do not re-run the job: that deletes and rebuilds
          # the release. Use the npm-publish job below.
          npm --version
          npm publish --access public

  # Publish-only retry:
  #   gh workflow run auto-release.yml -f npm_publish_version=3.21.22
  #
  # npm is the last step of a release, so when it alone fails (the trusted publisher
  # on npmjs.com not matching, a registry outage) everything else is already out.
  # This job publishes the package from the release tag and touches nothing else.
  # It has to live in this file: npm ties the trusted publisher to the workflow
  # filename. The provenance npm records names the commit the workflow was started
  # from (master at that moment), not the tag the package is built from.
  npm-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.npm_publish_version != ''
    permissions:
      # contents: read the release. id-token: npm trusted publishing (OIDC).
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.npm_publish_version }}
    steps:
      - name: Check the version asked for
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::npm_publish_version must look like 3.21.22, got '$VERSION'"
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.npm_publish_version }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # No registry-url, for the reason given in the release job above.
          node-version: '24'

      - name: Check the release and the registry
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package.json').name")
          TAGGED=$(node -p "require('./package.json').version")
          if [ "$TAGGED" != "$VERSION" ]; then
            echo "::error ::Tag v$VERSION holds package.json version $TAGGED"
            exit 1
          fi

          # The package's installer downloads the binary from the GitHub release.
          if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error ::Release v$VERSION is missing or still a draft"
            exit 1
          fi

          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice ::$NAME@$VERSION is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A publish moves the 'latest' tag to the version published.
          LATEST=$(npm view "$NAME" version)
          if [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error ::npm's latest is $LATEST; publishing $VERSION now would move 'latest' backwards"
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Show what npm is asked to trust
        if: steps.check.outputs.publish == 'true'
        # Diagnostic only; it must never stop the publish.
        continue-on-error: true
        run: |
          # The trusted publisher on npmjs.com has to match these claims of this run's
          # OIDC token: owner and repository, workflow filename, environment. They are
          # public facts about the run; the token itself is never printed.
          node -e '
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=npm:registry.npmjs.org";
            const auth = "bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            fetch(url, { headers: { Authorization: auth } })
              .then((res) => res.json())
              .then(({ value }) => {
                const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url").toString());
                for (const key of ["repository", "workflow_ref", "environment", "event_name"]) {
                  console.log(key + ": " + (claims[key] ?? "(none)"));
                }
              })
              .catch((err) => {
                console.error("could not read the OIDC token claims: " + err.message);
                process.exit(1);
              });
          '

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: |
          # verbose: when the registry refuses the trusted publisher, npm reports the
          # reason only at this level and then fails with a bare ENEEDAUTH.
          npm --version
          npm publish --access public --loglevel verbose
