name: Build

on:
  # OpenNeko's paths are ignored: a Build on master triggers auto-release,
  # and an OpenNeko-only change must not release GraphJin.
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "apps/**"
      - "packages/**"
      - "packs/**"
      - "db/**"
      - "deploy/**"
      - "evals/**"
      - ".impeccable/**"
      - "Dockerfile"
      - "compose*.yml"
      - "entrypoint.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/**"
      - "website/**"
      - "apps/**"
      - "packages/**"
      - "packs/**"
      - "db/**"
      - "deploy/**"
      - "evals/**"
      - ".impeccable/**"
      - "Dockerfile"
      - "compose*.yml"
      - "entrypoint.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "release-please-config.json"
      - ".release-please-manifest.json"

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.10"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: make build

      - name: Run Tests
        run: make test
