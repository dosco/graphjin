baseURL = "https://graphjin.com/"
locale = "en-us"
title = "GraphJin"
disableKinds = ["taxonomy", "term"]
enableGitInfo = false
relativeURLs = false
canonifyURLs = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "GraphJin compiles GraphQL into governed database, API, file, code, and agentic data access."
  github = "https://github.com/dosco/graphjin"
  install = "curl -fsSL https://graphjin.com/install.sh | bash"

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "assets"
  target = "assets"
