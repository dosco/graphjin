baseURL = "https://graphjin.com/"
locale = "en-us"
title = "DeepORG"
disableKinds = ["taxonomy", "term"]
enableGitInfo = false
relativeURLs = false
canonifyURLs = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "DeepORG is one governed AI agent for your whole organization — answering questions and carrying out operations across your databases, APIs, files, and code, built on the open-source GraphJin engine."
  home_seo_title = "DeepORG — One Governed AI Agent for Your Whole Organization: databases, APIs, files, and code"
  github = "https://github.com/dosco/graphjin"
  install = "curl -fsSL https://graphjin.com/install.sh | bash"

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "../VISION.md"
  target = "assets/root-docs/vision.md"

[[module.mounts]]
  source = "../SECURITY.md"
  target = "assets/root-docs/security.md"

[[module.mounts]]
  source = "../AGENTIC.md"
  target = "assets/root-docs/agentic.md"

[[module.mounts]]
  source = "assets"
  target = "assets"
