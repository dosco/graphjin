# Development backing services. Web and worker run on the host with hot
# reload (`pnpm dev`), and so do `openneko serve` and `openneko sandbox`
# (scripts/dev-agent.sh). `pnpm dev:up` starts these services with
# compose.yml, compose.adventureworks.yml and compose.graphjin-agent.yml
# (sources-mode customer GraphJin).
#
# Every service a host process calls publishes a loopback port, and GraphJin
# config directories live on the host so the worker manages them.
services:
  # Development databases have no managed backup lifecycle. With archiving
  # enabled, a missing stanza pins WAL forever even while the stack is idle.
  neko-db:
    command: [postgres, -c, archive_mode=off, -c, wal_compression=on, -c, temp_file_limit=5GB]

  records-db:
    command: [postgres, -c, archive_mode=off, -c, wal_compression=on, -c, temp_file_limit=5GB]

  embedding:
    ports:
      - "127.0.0.1:${OPENNEKO_EMBEDDING_PORT:-5003}:5003"

  # The host worker writes the records configs owner-only, so the directory
  # and both records GraphJin instances belong to the host user
  # (scripts/dev-env.sh), not the image's worker user.
  records-graphjin-config-init:
    entrypoint: !override
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /config/watch
        chown -R ${OPENNEKO_DEV_UID:-1001}:${OPENNEKO_DEV_GID:-1001} /config
        chmod 0700 /config /config/watch
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/records-graphjin:/config

  records-graphjin:
    user: "${OPENNEKO_DEV_UID:-1001}:${OPENNEKO_DEV_GID:-999}"
    ports:
      - "127.0.0.1:${OPENNEKO_RECORDS_GRAPHJIN_PORT:-8090}:8090"
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/records-graphjin:/config:ro

  records-watch-graphjin:
    user: "${OPENNEKO_DEV_UID:-1001}:${OPENNEKO_DEV_GID:-999}"
    ports:
      - "127.0.0.1:${OPENNEKO_RECORDS_WATCH_GRAPHJIN_PORT:-8091}:8090"
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/records-graphjin:/config:ro

  graphjin-config-init:
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config
      - ./db/graphjin/dev.sources.example.yml:/seed/agentic.yml:ro

  # scripts/dev-up.sh writes the JWT secret from source before GraphJin
  # starts, so GraphJin does not wait on the worker-image secret init.
  graphjin:
    depends_on: !override
      graphjin-config-init:
        condition: service_completed_successfully
      adventureworks-init:
        condition: service_completed_successfully
    environment: !override
      GO_ENV: agentic
      GRAPHJIN_AGENT_API_KEY: ${GRAPHJIN_AGENT_API_KEY:-}
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config
