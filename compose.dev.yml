# Development backing services. Web and worker run on the host with hot
# reload (`pnpm dev`), and so do `openneko serve` and `openneko sandbox`
# (scripts/dev-agent.sh). `pnpm dev:up` starts these services with
# compose.yml, compose.adventureworks.yml and compose.graphjin-agent.yml
# (sources-mode customer GraphJin).
#
# Every service a host process calls publishes a loopback port, and GraphJin
# config directories live on the host so the worker manages them.
services:
  embedding:
    ports:
      - "127.0.0.1:${OPENNEKO_EMBEDDING_PORT:-5003}:5003"

  # Host web and worker write into this folder as the host user (the agent
  # key file, Library uploads), so in dev the folder and the customer
  # GraphJin belong to the host user too, not the image's uid 1001.
  graphjin-config-init:
    entrypoint: !override
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -f /config/agentic.yml ]; then
          cp /seed/agentic.yml /config/agentic.yml
          KEY=$$(head -c 32 /dev/urandom | base64 | tr -d '\n')
          sed -i "s|REPLACE_WITH_BASE64_32_BYTE_KEY|$$KEY|" /config/agentic.yml
        fi
        chown -R ${OPENNEKO_DEV_UID:-1001}:${OPENNEKO_DEV_GID:-999} /config
        chmod 0700 /config
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config
      - ./db/graphjin/dev.sources.example.yml:/seed/agentic.yml:ro

  # scripts/dev-up.sh writes the JWT secret from source before GraphJin
  # starts, so GraphJin does not wait on the worker-image secret init.
  # Runs the openneko binary scripts/dev-up.sh builds from source, so GraphJin
  # changes show up without rebuilding the agent image.
  openneko-serve:
    user: "${OPENNEKO_DEV_UID:-1001}:${OPENNEKO_DEV_GID:-999}"
    depends_on: !override
      graphjin-config-init:
        condition: service_completed_successfully
      adventureworks-init:
        condition: service_completed_successfully
    environment: !override
      GO_ENV: agentic
      GRAPHJIN_AGENT_API_KEY: ${GRAPHJIN_AGENT_API_KEY:-}
      OPENNEKO_SUBSCRIPTIONS_DB: neko-db:5432/neko
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/bin/openneko:/usr/local/bin/openneko:ro
