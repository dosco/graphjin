# Production source-mode template for the CUSTOMER-data GraphJin.
#
# A fresh install intentionally has no customer database source. OpenNeko ships
# this GraphJin container and its governed config plane; an admin then registers
# the customer's existing database or API source through setup/chat. The demo
# overlay replaces this seed with dev.sources.example.yml, which includes the
# AdventureWorks source.
#
# The worker replaces the JWT placeholder with the deployment/org-derived
# signing secret at boot. Before GraphJin starts, graphjin-secret-init sets
# the keystore key to one derived from the OpenNeko secret key; a key that
# sealed values moves to secrets.keystore.previous_keys and GraphJin re-seals.

app_name: OpenNeko Customer Data
mode: agentic
host_port: 0.0.0.0:8080
production: true
# OpenNeko and the GraphJin server agent compile ad-hoc, role-scoped GraphQL
# from chat. This disables the production named-query allow-list; JWT auth,
# source access, read_only, and admin-only roots still apply.
disable_production_security: true
debug: false
log_format: plain
log_level: info
http_compress: true
reload_on_config_change: true
server_timing: true

auth:
  type: jwt
  jwt:
    secret: "REPLACE_WITH_PER_ORG_SECRET_B64"
    audience: ""
    issuer: ""

roles_query: ""
identity:
  user_id_claim: sub
  role_claims:
    - role
  namespace_claim: org_id
  admin_roles:
    - admin

auth_fail_block: true

cors_allowed_origins:
  - '*'

default_limit: 20
enable_tracing: true
subs_poll_duration: 5s

mcp:
  disable: false
  # The approved OpenNeko worker applies reviewed gj_config previews. The
  # GraphJin server agent itself remains read-only.
  allow_config_updates: true
  include_tools_with_agent: true
  # Mutations pass the MCP layer so API sources can take governed writes.
  # Every database source stays read_only: true; GraphJin core blocks its
  # mutations and pins the flag at startup.
  allow_mutations: true
  allow_raw_queries: true
  workflow_timeout: 300
  allow_dev_tools: false
  legacy_discovery: false

agent:
  enabled: true
  provider: openai
  model: gpt-4.1-mini
  api_key_env: GRAPHJIN_AGENT_API_KEY
  max_steps: 8
  timeout_seconds: 50
  read_only: true
  return_trace: false

analytics_mode: true

# Semantic catalog and Library file search through OpenNeko's embedding
# service (EmbeddingGemma 2). Off until an admin turns on Settings > Semantic
# search; graphjin-secret-init writes `enabled` from that switch at startup and
# OpenNeko applies later flips live through gj_config.
catalog_search:
  semantic:
    enabled: false
    provider: openai
    embedding_model: google/embeddinggemma-2
    base_url: http://embedding:5003/v1
    api_key_env: OPENNEKO_EMBEDDING_API_KEY
    dimensions: default
    query_prefix: "task: search result | query: "
    document_prefix: "title: none | text: "

# Customer sources are read-only by default and may be absent on first boot.
# OpenNeko watchers run as GraphJin watches. Their store is GraphJin's managed
# SQLite file in this config directory, never a customer database.
# graphjin-secret-init keeps these values current on existing installs.
# artifacts is left unset: GraphJin then uses its managed store.
watches:
  enabled: true
  runner: all
  max_per_owner: 1000
  webhook_allow:
    - http://worker:4100/admin/events/watcher
tasks:
  enabled: false

# Keep every JWT role explicit: GraphJin re-normalizes roles on config updates,
# and a source's access.write block is generated only for roles listed here.
# A JWT role that is missing from this list gets no block.
roles:
  - name: user
    comment: Authenticated user
  - name: member
    comment: OpenNeko organization member (JWT role minted by the worker)
  - name: service
    comment: OpenNeko worker service identity (JWT role minted by the worker)
  - name: admin
    comment: Org admin

# Required for GraphJin to seal database passwords into gjsecret:// refs.
secrets:
  keystore:
    key: "REPLACE_WITH_BASE64_32_BYTE_KEY"

blocklist:
  - ar_internal_metadata
  - schema_migrations
  - secret
  - password
  - encrypted
  - token

system:
  capabilities:
    catalog.read: true
    security.read: true
    config.read: true
    config.write: true
    runtime.read: true
    raw_graphql.query: true
    raw_graphql.mutate: true
    schema.reload: false
    schema.write: false
    dev_tools.read: false
    legacy_discovery.read: false
  root_access:
    gj_catalog: authenticated
    gj_config: admin
    gj_security: admin
    gj_runtime: admin
    gj_watch: authenticated

# Keep source mode explicit on a fresh install; admins add external database,
# API, code, or file sources through OpenNeko's approved config workflow.
sources: []
