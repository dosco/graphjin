# Make sure to check the documentation at http://goreleaser.com

# Snapcraft credentials
# snapcraft export-login --snaps=graphjin --channels=stable --acls=package_access,package_push,package_update,package_release credential

# GPG Key
# gpg --armor --export-secret-key <email> | pbcopy
version: 2

# Set on purpose. Left unset, GoReleaser takes this from the name of the GitHub
# repository, so renaming the repository renames every archive, package and
# formula in the next release without a line of this file changing. It is the
# command's name, not the repository's.
project_name: deeporg

before:
  hooks:
    - go mod download
    - make gen
# One build. The command is `deeporg`; `graphjin`, its old name, is never built
# a second time. Each channel below puts it on the PATH as a link to this same
# file, so scripts, CI jobs and MCP client configs written before the rename
# keep working.
builds:
  - id: deeporg
    main: ./cmd
    binary: deeporg
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
      - -X github.com/dosco/graphjin/serv/v3.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    # 386 and arm are paused: the ax-llm Go package does not build for
    # 32-bit targets yet.
    goarch:
      - amd64
      - arm64

kos:
  - id: graphjin-docker
    build: deeporg
    main: ./cmd
    repositories:
      - dosco/graphjin
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - latest
      - "{{ .Version }}"
    bare: true
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
      - -X github.com/dosco/graphjin/serv/v3.version={{ .Version }}
    env:
      - CGO_ENABLED=0

  # The agent environment image. Same source, same build, same repository —
  # only the role differs, because ko sets the entrypoint to the binary and
  # offers no way to give it arguments (goreleaser's ko block has no
  # entrypoint/cmd/args field). The role ldflag is how the binary knows to
  # serve `env serve`, listen off loopback, and pin its clock to the build
  # date so one tag measures one thing forever.
  #
  # Published alongside the server image under env-* tags, so `latest` and the
  # version tag keep meaning the database server and nothing about this entry
  # can change what an existing `docker pull dosco/graphjin` gets.
  - id: graphjin-env-docker
    build: deeporg
    main: ./cmd
    repositories:
      - dosco/graphjin
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - env-latest
      - "env-{{ .Version }}"
    bare: true
    labels:
      org.opencontainers.image.title: graphjin-env
      org.opencontainers.image.description: GraphJin as a graded agent environment for training and evaluation
      org.opencontainers.image.source: https://github.com/dosco/deeporg
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
      - -X github.com/dosco/graphjin/serv/v3.version={{ .Version }}
      - -X main.imageRole=env
    env:
      - CGO_ENABLED=0

signs:
  - artifacts: checksum
    args:
      [
        "--batch",
        "-u",
        "{{ .Env.GPG_FINGERPRINT }}",
        "--output",
        "${signature}",
        "--detach-sign",
        "${artifact}",
      ]

# install.sh and bin/install.js download archives by this name, so it is
# spelled out rather than left to the default. Releases up to v3.21.21 were
# graphjin_<version>_<os>_<arch>.tar.gz with a `graphjin` binary inside; both
# installers still fall back to that name for an older version.
#
# The archive holds the one binary. A `graphjin` link is not packed beside it:
# a tar symlink does not survive extraction on Windows, and each installer
# makes the link itself.
archives:
  - id: deeporg
    ids:
      - deeporg
    name_template: "deeporg_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch
      - go mod tidy

nfpms:
  - id: deeporg
    ids:
      - deeporg
    package_name: deeporg
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://deeporg.io
    description: "One AI agent for your whole organization."
    license: Apache-2.0
    maintainer: Vikram Rangnekar (https://twitter.com/dosco)
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    # /usr/bin/graphjin -> deeporg, the old command name.
    contents:
      - src: deeporg
        dst: /usr/bin/graphjin
        type: symlink
    # The package used to be called graphjin and owned /usr/bin/graphjin as a
    # file. These let the new package take over from an installed old one
    # instead of failing on the path they both ship.
    provides:
      - graphjin
    replaces:
      - graphjin
    overrides:
      deb:
        conflicts:
          - graphjin

# Two formulas from the same archives, in the tap that exists today
# (dosco/homebrew-graphjin). `deeporg` is the one to install from now on.
# `graphjin` is still written so that `brew upgrade` on a machine that
# installed it under the old name keeps getting releases; it can go once the
# tap carries a formula_renames.json pointing graphjin at deeporg. Both install
# the same two commands, so they are declared as conflicting.
brews:
  - name: deeporg
    ids:
      - deeporg
    repository:
      owner: dosco
      name: homebrew-graphjin
    directory: Formula
    homepage: https://deeporg.io
    description: "One AI agent for your whole organization"
    license: Apache-2.0
    skip_upload: false
    conflicts:
      - graphjin
    extra_install: |
      bin.install_symlink bin/"deeporg" => "graphjin"
    test: |
      system "#{bin}/deeporg", "version"
      system "#{bin}/graphjin", "version"

  - name: graphjin
    ids:
      - deeporg
    repository:
      owner: dosco
      name: homebrew-graphjin
    directory: Formula
    homepage: https://deeporg.io
    description: "One AI agent for your whole organization (old name of deeporg)"
    license: Apache-2.0
    skip_upload: false
    conflicts:
      - deeporg
    extra_install: |
      bin.install_symlink bin/"deeporg" => "graphjin"
    test: |
      system "#{bin}/deeporg", "version"
      system "#{bin}/graphjin", "version"

