apiVersion: openneko.app/v1
kind: SolutionPack
metadata:
  id: parallel-search
  name: Parallel web search
  version: 0.1.0
  publisher: openneko
  category: research

compatibility:
  openneko: ">=4.9.0 <5.0.0"
  graphjin:
    analytics: ">=3.21.0 <4.0.0"
    operator: ">=3.21.0 <4.0.0"
  applications:
    - id: parallel
      editions: [cloud]
      versions: v1beta
  databases: []

inputs: []

secrets:
  - key: parallel-search.api_key
    purpose: graphjin_api_auth
    required: true

permissions:
  network:
    - api.parallel.ai

# The Search API takes POST only, so the pack has no saved query.
artifacts:
  graphjin:
    sources: graphjin/sources.yaml
    relationships: graphjin/relationships.yaml
    specs:
      - graphjin/specs/parallel.yaml
  actions: actions
  policies: policies
  skills:
    - skills/parallel-web-search

health:
  requiredPreflight: []
  readiness:
    search: []
  postInstall: []
  postWriteCanary: []
