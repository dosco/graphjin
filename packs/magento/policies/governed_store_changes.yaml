key: policy.governed_store_changes
targetRef: magento.policy.governed_store_changes
name: Magento governed store changes
description: Magento writes require administrator approval; eligible automatic rules may create separately limited auto-approved requests.
appliesToKinds:
  - magento.manage_catalog
  - magento.manage_inventory
  - magento.manage_orders
  - magento.manage_promotions
  - magento.manage_content
  - magento.manage_customers
  - magento.undo_changeset
appliesToScopes: [external]
mode: ask
approverRole: admin
priority: 10
enabled: true
allowedTargets:
  source: magento_operator
  spec: magento-operator-v2
limits:
  handoffOnlyExecutePath: false
  retry: never
  requireNamedScope: true
  requireBeforeImage: true
  reconcileEveryRow: true
