key: action.manage_customers
targetRef: magento.manage_customers
kind: magento.manage_customers
description: Correct explicitly enabled customer fields with data-minimized receipts; this domain is off by default.
domain: customers
readiness:
  capability: operator
  domain: customers
  unavailableReasons: [domain_disabled, graphjin_version_unsupported, integration_token_missing, integration_token_invalid, acl_missing]
inputSchema:
  type: object
  additionalProperties: false
  required: [operation, scope, rows, idempotency_key]
  properties:
    operation: { type: string, enum: [customer_update] }
    scope: { type: object }
    rows: { type: array, minItems: 1, maxItems: 100 }
    idempotency_key: { type: string, minLength: 8, maxLength: 200 }
adapter:
  kind: magento_changeset
  source: magento_operator
  spec: magento-operator-v2
  ambiguousOutcome: reconcile_required
  retry: never
  operations:
    customer_update:
      operationId: magentoUpdateCustomer
      mutationRoot: magento_operator_v2_magento_update_customer
      readPath: /V1/customers/{customerId}
      defaultClass: 1
      entityType: customer
      reversible: true
      bodyKey: customer
      inverseOperation: customer_update
      numericPathParams: [customerId]
