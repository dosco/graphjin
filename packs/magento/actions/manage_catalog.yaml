key: action.manage_catalog
targetRef: magento.manage_catalog
kind: magento.manage_catalog
description: >-
  Create and edit Magento products, categories, assignments, and prices through governed change-sets.
  Use a named scope such as {store: default}; update existing product text in body.product.custom_attributes.
domain: catalog
readiness:
  capability: operator
  domain: catalog
  unavailableReasons: [graphjin_version_unsupported, integration_token_missing, integration_token_invalid, acl_missing, graphjin_restart_required]
inputSchema:
  type: object
  additionalProperties: false
  required: [operation, scope, rows, idempotency_key]
  properties:
    operation: { type: string }
    scope: { type: object }
    rows: { type: array, minItems: 1, maxItems: 500 }
    projected_exposure: { type: number, minimum: 0 }
    idempotency_key: { type: string, minLength: 8, maxLength: 200 }
adapter:
  kind: magento_changeset
  source: magento_operator
  spec: magento-operator-v2
  ambiguousOutcome: reconcile_required
  retry: never
  operations:
    product_create:
      operationId: magentoCreateProduct
      mutationRoot: magento_operator_v2_magento_create_product
      readPath: /V1/products/{sku}
      defaultClass: 2
      entityType: product
      reversible: true
      bodyKey: product
      inverseOperation: product_delete
      entityIdField: sku
    product_update:
      operationId: magentoUpdateProduct
      mutationRoot: magento_operator_v2_magento_update_product
      readPath: /V1/products/{sku}
      defaultClass: 2
      entityType: product
      reversible: true
      bodyKey: product
      inverseOperation: product_update
      entityIdField: sku
    product_bulk_update:
      operationId: magentoBulkUpdateProducts
      mutationRoot: magento_operator_v2_magento_bulk_update_products
      readPath: /V1/products/{sku}
      defaultClass: 2
      entityType: product
      reversible: true
      bodyKey: product
      inverseOperation: product_bulk_update
      entityIdField: sku
      resultMode: async_bulk
    product_delete:
      operationId: magentoDeleteProduct
      mutationRoot: magento_operator_v2_magento_delete_product
      readPath: /V1/products/{sku}
      defaultClass: 1
      entityType: product
      reversible: true
      bodyKey: product
      inverseOperation: product_create
      entityIdField: sku
    base_prices_set:
      operationId: magentoSetBasePrices
      mutationRoot: magento_operator_v2_magento_set_base_prices
      defaultClass: 1
      entityType: product
      reversible: false
    special_prices_set:
      operationId: magentoSetSpecialPrices
      mutationRoot: magento_operator_v2_magento_set_special_prices
      defaultClass: 1
      entityType: product
      reversible: false
    special_prices_delete:
      operationId: magentoDeleteSpecialPrices
      mutationRoot: magento_operator_v2_magento_delete_special_prices
      defaultClass: 1
      entityType: product
      reversible: false
    tier_prices_set:
      operationId: magentoSetTierPrices
      mutationRoot: magento_operator_v2_magento_set_tier_prices
      defaultClass: 1
      entityType: product
      reversible: false
    tier_prices_delete:
      operationId: magentoDeleteTierPrices
      mutationRoot: magento_operator_v2_magento_delete_tier_prices
      defaultClass: 1
      entityType: product
      reversible: false
    category_create:
      operationId: magentoCreateCategory
      mutationRoot: magento_operator_v2_magento_create_category
      readPath: /V1/categories/{id}
      defaultClass: 2
      entityType: category
      reversible: true
      bodyKey: category
      inverseOperation: category_delete
      entityIdField: id
    category_update:
      operationId: magentoUpdateCategory
      mutationRoot: magento_operator_v2_magento_update_category
      readPath: /V1/categories/{id}
      defaultClass: 2
      entityType: category
      reversible: true
      bodyKey: category
      inverseOperation: category_update
      entityIdField: id
      numericPathParams: [id]
    category_delete:
      operationId: magentoDeleteCategory
      mutationRoot: magento_operator_v2_magento_delete_category
      readPath: /V1/categories/{id}
      defaultClass: 1
      entityType: category
      reversible: true
      bodyKey: category
      inverseOperation: category_create
      entityIdField: id
      numericPathParams: [id]
    category_move:
      operationId: magentoMoveCategory
      mutationRoot: magento_operator_v2_magento_move_category
      readPath: /V1/categories/{categoryId}
      defaultClass: 2
      entityType: category
      reversible: true
      inverseOperation: category_move
      entityIdField: categoryId
      numericPathParams: [categoryId]
    category_product_assign:
      operationId: magentoAssignCategoryProduct
      mutationRoot: magento_operator_v2_magento_assign_category_product
      defaultClass: 2
      entityType: category
      reversible: false
      numericPathParams: [categoryId]
    category_products_replace:
      operationId: magentoReplaceCategoryProducts
      mutationRoot: magento_operator_v2_magento_replace_category_products
      defaultClass: 2
      entityType: category
      reversible: false
      numericPathParams: [categoryId]
