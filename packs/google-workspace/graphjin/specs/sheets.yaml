openapi: 3.0.3
info: { title: Google Sheets read API, version: 1.0.0 }
servers: [{ url: https://sheets.googleapis.com }]
security: [{ oauthBearer: [] }]
paths:
  /v4/spreadsheets/{spreadsheetId}:
    get:
      operationId: getSpreadsheet
      parameters:
        - { name: spreadsheetId, in: path, required: true, schema: { type: string } }
        - { name: ranges, in: query, schema: { type: array, items: { type: string } } }
        - { name: includeGridData, in: query, schema: { type: boolean } }
        - { name: fields, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /v4/spreadsheets/{spreadsheetId}/values/{range}:
    get:
      operationId: getSpreadsheetValues
      parameters:
        - { name: spreadsheetId, in: path, required: true, schema: { type: string } }
        - { name: range, in: path, required: true, schema: { type: string } }
        - { name: majorDimension, in: query, schema: { type: string, enum: [ROWS, COLUMNS] } }
        - { name: valueRenderOption, in: query, schema: { type: string } }
        - { name: dateTimeRenderOption, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      operationId: updateSpreadsheetValues
      parameters:
        - { name: spreadsheetId, in: path, required: true, schema: { type: string } }
        - { name: range, in: path, required: true, schema: { type: string } }
        - { name: valueInputOption, in: query, required: true, schema: { type: string, enum: [RAW, USER_ENTERED] } }
        - { name: includeValuesInResponse, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValueRange" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /v4/spreadsheets/{spreadsheetId}/values/{range}:append:
    post:
      operationId: appendSpreadsheetValues
      parameters:
        - { name: spreadsheetId, in: path, required: true, schema: { type: string } }
        - { name: range, in: path, required: true, schema: { type: string } }
        - { name: valueInputOption, in: query, required: true, schema: { type: string, enum: [RAW, USER_ENTERED] } }
        - { name: insertDataOption, in: query, schema: { type: string, enum: [OVERWRITE, INSERT_ROWS] } }
        - { name: includeValuesInResponse, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValueRange" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /v4/spreadsheets/{spreadsheetId}/values/{range}:clear:
    post:
      operationId: clearSpreadsheetValues
      parameters:
        - { name: spreadsheetId, in: path, required: true, schema: { type: string } }
        - { name: range, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /v4/spreadsheets/{spreadsheetId}/values:batchGet:
    get:
      operationId: batchGetSpreadsheetValues
      parameters:
        - { name: spreadsheetId, in: path, required: true, schema: { type: string } }
        - { name: ranges, in: query, required: true, schema: { type: array, items: { type: string } } }
        - { name: majorDimension, in: query, schema: { type: string, enum: [ROWS, COLUMNS] } }
        - { name: valueRenderOption, in: query, schema: { type: string } }
        - { name: dateTimeRenderOption, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /v4/spreadsheets/{spreadsheetId}/values:batchUpdate:
    post:
      operationId: batchUpdateSpreadsheetValues
      parameters:
        - { name: spreadsheetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchUpdateValuesRequest" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
components:
  securitySchemes:
    oauthBearer: { type: http, scheme: bearer }
  responses:
    Object:
      description: Google API response
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  schemas:
    ValueRange:
      type: object
      additionalProperties: false
      properties:
        range: { type: string }
        majorDimension: { type: string, enum: [ROWS, COLUMNS] }
        values:
          type: array
          items:
            type: array
            items: {}
    BatchUpdateValuesRequest:
      type: object
      additionalProperties: false
      required: [valueInputOption, data]
      properties:
        valueInputOption: { type: string, enum: [RAW, USER_ENTERED] }
        includeValuesInResponse: { type: boolean }
        data:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ValueRange" }
