# Provider list prices for published benchmark rows, in USD per million tokens.
#
# Cost is the most useful column on the board — a score without it says nothing
# about whether the work is affordable — but it used to arrive through
# --prompt-price-per-million / --completion-price-per-million at publish time.
# Flags are easy to forget, and the entire 2028.2 cohort was published without
# them, leaving the leaderboard's cost-per-reliable-pass axis reading zero for
# every model. Prices belong with the data, not in a shell command.
#
# The publisher looks a row up by provider and model. The CLI flags still work
# and take precedence, for a model that is not listed yet or a negotiated rate
# that is not list price.
#
# Record `source` and `as_of` for every entry: a published cost figure is a
# claim, and it needs a citation like any other number on the board.
version: 1
models:
  - provider: gemini
    model: gemini-3.5-flash-lite
    prompt_per_million: 0.30
    completion_per_million: 2.50
    source: https://ai.google.dev/gemini-api/docs/pricing (standard, 2026-08-06)
    as_of: 2026-08-06

  - provider: gemini
    model: gemini-3.7-flash
    prompt_per_million: 0.75
    completion_per_million: 3.75
    # Promotional rate through 2026-12-31; it doubles to 1.50/7.50 on
    # 2027-01-01, so revisit this entry rather than assuming it holds.
    source: https://ai.google.dev/gemini-api/docs/pricing (standard, paid tier, 2026-08-19)
    as_of: 2026-08-19

  - provider: deepseek
    model: deepseek-v4-flash
    prompt_per_million: 0.14
    completion_per_million: 0.28
    source: https://api-docs.deepseek.com/quick_start/pricing (standard, 2026-08-17)
    as_of: 2026-08-17
  - provider: together
    model: meta-models/Muse-Glimmer-30B
    prompt_per_million: 0.35
    completion_per_million: 1.50
    # Read from Together's own model listing rather than a docs page: the
    # per-model pricing block is returned by the API itself, which is the
    # authoritative rate for this deployment.
    source: https://api.together.xyz/v1/models (pricing.input/output for meta-models/Muse-Glimmer-30B, 2026-08-21)
    as_of: 2026-08-21
  - provider: gemini
    model: gemini-3.5-flash
    prompt_per_million: 1.50
    completion_per_million: 9.00
    source: https://ai.google.dev/gemini-api/docs/pricing (standard, paid tier, 2026-08-21)
    as_of: 2026-08-21

  - provider: openai
    model: gpt-4o-mini
    prompt_per_million: 0.15
    completion_per_million: 0.60
    # Back-derived from this board's own published gpt-4o-mini row and confirmed
    # against its recorded token counts to the cent.
    source: published deeporg row 20260812T*-gpt-4o-mini (list price at publish time)
    as_of: 2026-08-21

  - provider: openai
    model: gpt-5.4-mini
    prompt_per_million: 0.75
    completion_per_million: 4.50
    # Solved from two published gpt-5.4-mini rows (two equations, two unknowns);
    # both reproduce their recorded cost exactly.
    source: published deeporg rows (list price at publish time)
    as_of: 2026-08-21
