# yaml-language-server: $schema=./config.schema.json
# Inherit config from this other config file
# so I only need to overwrite some values
inherits: dev

app_name: "{{- .AppName }} Production"
mode: prod
host_port: 0.0.0.0:8080
# Defaults off in prod. Set true only when the console is protected.
web_ui: false

# Log levels: debug, error, warn, info
log_level: "warn"

# Log formats: json, plain 
log_format: "json"

# Enable or disable http compression (uses gzip)
http_compress: true

# When production mode is 'true' only queries from the queries 
# folder can be used.
production: true

# Throw a 401 on auth failure for queries that need auth
auth_fail_block: true

# Latency tracing for database queries and remote joins
# the resulting latency information is returned with the
# response
enable_tracing: false

# Watch the config folder and reload GraphJin
# with the new configs when a change is detected
reload_on_config_change: false

# File that points to the database seeding script
# seed_file: seed.js

# Secret key for general encryption operations like 
# encrypting the cursor data
# secret_key: supercalifajalistics

# CORS: A list of origins a cross-domain request can be executed from. 
# If the special * value is present in the list, all origins will be allowed. 
# An origin may contain a wildcard (*) to replace 0 or more 
# characters (i.e.: http://*.domain.com).
# cors_allowed_origins: ["*"]

# CORS: A list of headers the client is allowed to use with cross-domain
# requests. If the special "*" value is present in the list, all headers will be
# allowed. Default value is ["Origin", "Accept", "Content-Type",
# "X-Requested-With", "Authorization"]. Even if the list is empty, the "Origin"
# is always appended to the list.
# cors_allowed_headers: []

# Debug Cross Origin Resource Sharing requests
# cors_debug: false

# Default API path prefix is /api you can change it if you like
# api_path: "/data"

# Cache-Control header can help cache queries if your CDN supports cache-control 
# cache_control: "public, max-age=300, s-maxage=600"

# Subscriptions poll the database to query for updates
# this sets the duration between requests.
# subs_poll_duration: 2s

# Auth related environment Variables
# GJ_AUTH_JWT_PUBLIC_KEY_FILE

# open opencensus tracing and metrics
# telemetry:
#   debug: false
#   metrics:
#     exporter: "prometheus"
#   tracing:
#     exporter: "zipkin"
#     endpoint: "http://zipkin:9411/api/v2/spans"
#     sample: 0.6

# Cache-first schema discovery is enabled by default. For multiple replicas,
# mount this path on a shared read-after-write filesystem and configure
# redis.url. A single GraphJin process does not require Redis.
discovery_cache:
  enabled: true
  path: .graphjin/discovery
  refresh_interval: 5m
  startup_wait: 2m
  retain_generations: 2

# Optional Ax-backed semantic catalog recall. Vectors stay on the filesystem;
# Redis holds coordination state only.
catalog_search:
  semantic:
    enabled: false
    provider: openai
    embedding_model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY
    base_url: ""
    dimensions: tiny

# ============================================================================
# MCP (Model Context Protocol) CONFIGURATION
# ============================================================================
# MCP enables AI assistants to interact with GraphJin for schema exploration
# and query building. In production, config updates are disabled for security.
# ============================================================================

mcp:
  # Disable MCP endpoints entirely
  disable: false

  # Standards-compatible OAuth for hosted MCP clients.
  # Enable when adding GraphJin by URL, for example:
  #   codex mcp add graphjin --url https://graphjin.example.com/api/v1/mcp
  oauth:
    enabled: false
    mode: external # builtin reuses auth_login; external advertises auth servers
    # resource: https://graphjin.example.com/api/v1/mcp
    # issuer: https://graphjin.example.com
    # authorization_servers:
    #   - https://graphjin.example.com
    scopes: ["mcp"]
    dynamic_client_registration: true
    client_id_metadata_documents: true

  # SECURITY: Config updates disabled in production
  # Databases, tables, roles must be configured in this file or via hot deploy
  allow_config_updates: false

  # Allow mutations (insert/update/delete) through MCP
  allow_mutations: true

  # SECURITY: Only allow saved queries in production (not raw GraphQL)
  allow_raw_queries: false

  # SECURITY: Keep the legacy execute_workflow MCP compatibility tool disabled.
  # Use gj_workflow_execution(insert) through GraphQL; block it with read_only.
  allow_workflow_execution: false

# ============================================================================
# SOURCES CONFIGURATION
# ============================================================================
# Production mode REQUIRES a database to be configured. These values come
# from `graphjin serve new --db-url`; move secrets to your deployment's
# configuration system before shipping.
#
# See dev.yml for database configuration examples for:
# PostgreSQL, MySQL, MariaDB, SQLite, Oracle, MS SQL Server, MongoDB, Snowflake
# Note: Snowflake requires connection_string.
# ============================================================================

sources:
  - name: default
    kind: database
    default: true
    type: {{ printf "%q" .DBType }}
    host: {{ printf "%q" .DBHost }}
    port: {{ .DBPort }}
{{ if eq .DBName "" }}    dbname: "{{ .AppNameSlug }}_production"
{{ else }}    dbname: {{ printf "%q" .DBName }}
{{ end }}    user: {{ printf "%q" .DBUser }}
    password: {{ printf "%q" .DBPass }}
    #schema: "public"
    #read_only: false  # Set to true to block all mutations and DDL (tamper-protected at runtime)

    # Alternatively, replace the fields above with a connection string.
    # connection_string: "postgres://user:password@host:5432/database"

    # Size of database connection pool
    # pool_size: 15

    # Max number of active database connections allowed
    # max_connections: 25

    # Max time after which idle database connections are closed
    # max_connection_idle_time: 5s

    # Max time after which database connections are not reused
    # max_connection_life_time: 0s

    #log_level: "debug"

    # database ping timeout is used for db health checking
    ping_timeout: 5m

    # Set up an secure tls encrypted db connection
    enable_tls: false

    # Required for tls. For example with Google Cloud SQL it's
    # <gcp-project-id>:<cloud-sql-instance>"
    # server_name: blah

    # Required for tls. Can be a file path or the contents of the pem file
    # server_cert: ./server-ca.pem

    # Required for tls. Can be a file path or the contents of the pem file
    # client_cert: ./client-cert.pem

    # Required for tls. Can be a file path or the contents of the pem file
    # client_key: ./client-key.pem
