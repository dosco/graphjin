  <rect class="diag-node" x="40" y="70" width="150" height="76" rx="10"/><text class="diag-text" x="115" y="104" text-anchor="middle">Local/S3/GCS</text><text class="diag-sub" x="115" y="126" text-anchor="middle">object roots</text>
  <rect class="diag-node-accent" x="258" y="54" width="192" height="108" rx="12"/><text class="diag-text" x="354" y="94" text-anchor="middle">Filesystem table</text><text class="diag-sub" x="354" y="118" text-anchor="middle">key · size · etag · url</text><text class="diag-sub" x="354" y="138" text-anchor="middle">data when selected</text>
