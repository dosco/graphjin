  <path class="diag-line" marker-end="url(#fs-arrow)" d="M190 108H258"/><path class="diag-line" marker-end="url(#fs-arrow)" d="M450 108H520"/><path class="diag-line" marker-end="url(#fs-arrow)" d="M652 108H708"/>
  <rect class="diag-node" x="142" y="212" width="576" height="46" rx="10"/><text class="diag-sub" x="430" y="240" text-anchor="middle">Read-only capability defaults let agents discover files without granting writes unless policy allows it.</text>
