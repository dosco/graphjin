<svg viewBox="0 0 860 360" role="img" aria-label="Why GraphJin" xmlns="http://www.w3.org/2000/svg">
  <rect class="diag-bg" width="860" height="360" rx="16"/>
  <rect class="diag-node-accent" x="42" y="44" width="230" height="116" rx="12"/><text class="diag-text" x="157" y="84" text-anchor="middle">Compiler, not ORM</text><text class="diag-sub" x="157" y="110" text-anchor="middle">GraphQL lowers to one planned</text><text class="diag-sub" x="157" y="130" text-anchor="middle">database operation where possible</text>
  <rect class="diag-node" x="314" y="44" width="230" height="116" rx="12"/><text class="diag-text" x="429" y="84" text-anchor="middle">Governed by default</text><text class="diag-sub" x="429" y="110" text-anchor="middle">roles, row filters, allow-lists,</text><text class="diag-sub" x="429" y="130" text-anchor="middle">read-only source boundaries</text>
  <rect class="diag-node" x="586" y="44" width="230" height="116" rx="12"/><text class="diag-text" x="701" y="84" text-anchor="middle">Agent-readable</text><text class="diag-sub" x="701" y="110" text-anchor="middle">catalog and security graph</text><text class="diag-sub" x="701" y="130" text-anchor="middle">before action</text>
  <rect class="diag-node" x="42" y="206" width="230" height="108" rx="12"/><text class="diag-text" x="157" y="246" text-anchor="middle">Multi-source</text><text class="diag-sub" x="157" y="272" text-anchor="middle">SQL, Mongo, files, code, APIs</text>
  <rect class="diag-node" x="314" y="206" width="230" height="108" rx="12"/><text class="diag-text" x="429" y="246" text-anchor="middle">Production mode</text><text class="diag-sub" x="429" y="272" text-anchor="middle">saved operations, no runtime drift</text>
  <rect class="diag-node" x="586" y="206" width="230" height="108" rx="12"/><text class="diag-text" x="701" y="246" text-anchor="middle">Test-backed</text><text class="diag-sub" x="701" y="272" text-anchor="middle">examples exercise real compiler paths</text>
</svg>
