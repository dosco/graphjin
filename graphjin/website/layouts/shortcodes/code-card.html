{{ $filename := .Get "filename" | default (.Get 0) | default "code" }}
{{ $language := .Get "language" | default "" }}
<figure class="home-code" data-code-block>
  <figcaption>
    <span>{{ $filename }}</span>
    <button class="copy-code-button" type="button" data-copy-code>Copy</button>
  </figcaption>
  <pre><code{{ with $language }} class="language-{{ . }}"{{ end }}>{{ .Inner | strings.TrimSpace | htmlEscape }}</code></pre>
</figure>
