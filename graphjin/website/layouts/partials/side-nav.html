{{ $current := .RelPermalink }}
{{ range hugo.Data.nav.groups }}
  {{ $pages := sort (where $.Site.RegularPages "Params.nav_group" .id) "Weight" }}
  {{ if $pages }}
    <div class="side-section">
      <div class="side-title">{{ .title }}</div>
      {{ range $pages }}
        <a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $current }} class="active" aria-current="page"{{ end }}>{{ .Params.nav_title | default .Title }}</a>
      {{ end }}
    </div>
  {{ end }}
{{ end }}
