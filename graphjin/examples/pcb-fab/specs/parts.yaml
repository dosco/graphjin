openapi: 3.0.0
info:
  title: Supplier Parts API
  version: 1.0.0
servers:
  - url: http://localhost:8093
paths:
  /parts/{sku}:
    get:
      operationId: getPartBySku
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Supplier part details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sku:
                        type: string
                      name:
                        type: string
                      lifecycle:
                        type: string
                      inventory_qty:
                        type: integer
                      lead_time_days:
                        type: integer
                      preferred_supplier:
                        type: string
