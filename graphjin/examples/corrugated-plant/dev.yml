app_name: Corrugated Plant Agentic Demo
mode: dev
host_port: 0.0.0.0:8081
web_ui: true
log_level: "info"
log_format: "plain"
http_compress: true
server_timing: true
production: false
auth_fail_block: true
enable_tracing: true
reload_on_config_change: false
enable_schema: false
secret_key: corrugated-plant-demo-secret
cors_allowed_origins: ["*"]
default_block: false
default_limit: 50

artifacts:
  locked: ["runbook"]

identity:
  user_id_claim: sub
  role_claims: ["roles"]
  namespace_claim: account_id
  admin_roles: ["admin"]

roles:
  - name: warehouse_manager
  - name: sales
  - name: admin

auth:
  type: jwt
  development: false
  jwt:
    secret: corrugated-demo-jwt-secret

mcp:
  allow_config_updates: false
  allow_workflow_updates: false
  allow_schema_reload: false
  allow_schema_updates: false

sources:
  - name: erp
    kind: database
    default: true
    type: mysql
    access:
      read: public
      write: authenticated
      delete: blocked
      missing_namespace_column: allow
    capabilities:
      data.read: true
      data.write: true
      schema.read: true
      schema.write: false

  - name: demand_warehouse
    kind: database
    type: bigquery
    read_only: true
    analytics_mode: true
    access:
      read: public
      write: blocked
      delete: blocked
      missing_namespace_column: allow
    capabilities:
      data.read: true
      data.write: false
      schema.read: true
      schema.write: false

  - name: plant_code
    kind: code
    path: app
    read_only: true
    infer_db_refs: true
    capabilities:
      code.search: true
      code.read: true
      code.write: false
      code.watch: false
      code.infer_db_refs: true

system:
  root_access:
    gj_config: admin
  capabilities:
    catalog.read: true
    security.read: true
    config.read: true
    config.write: false
    runtime.read: true
    raw_graphql.query: true
    raw_graphql.mutate: true
    schema.reload: false
    schema.write: false
    dev_tools.read: true
    legacy_discovery.read: false

workflows:
  path: workflows
  capabilities:
    execute: true
    read: true
    write: false
