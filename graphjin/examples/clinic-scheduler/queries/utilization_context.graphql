query utilization_context {
  rooms(order_by: { id: asc }, limit: 10) {
    id
    name
    kind
  }
  appointments(order_by: { scheduled_at: desc }, limit: 30) {
    id
    room_id
    provider_id
    scheduled_at
    duration_minutes
    status
  }
  no_show_events(order_by: { occurred_at: desc }, limit: 10) {
    id
    appointment_id
    patient_id
    occurred_at
    reason
  }
}
