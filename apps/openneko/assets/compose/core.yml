# Embedded core compose. The `openneko` binary materializes this and overlays
# dev.yml / demo.yml depending on `openneko start --mode`. Image tags are
# pinned to the binary's release version via the ${OPENNEKO_VERSION} env var
# (set by the supervisor before invoking docker compose). Operators who want
# to build from source should use the repo-root compose.yml instead.
x-neko-app-env: &neko-app-env
  HOME: /tmp/openneko-home
  TMPDIR: /tmp/openneko-tmp
  XDG_CONFIG_HOME: /config
  XDG_CACHE_HOME: /tmp/openneko-home/.cache
  XDG_DATA_HOME: /tmp/openneko-home/.local/share
  XDG_STATE_HOME: /tmp/openneko-home/.local/state
  NEKO_PG_HOST: neko-db
  NEKO_PG_PORT: "5432"
  NEKO_PG_USER: neko
  NEKO_PG_PASSWORD: secret
  NEKO_PG_DATABASE: neko
  NEKO_EMBEDDING_URL: http://embedding:5003
  NO_PROXY: localhost,127.0.0.1,::1,neko-db,worker,web,embedding,openneko-serve,graphjin,adventureworks-db,host.docker.internal,host.internal
  no_proxy: localhost,127.0.0.1,::1,neko-db,worker,web,embedding,openneko-serve,graphjin,adventureworks-db,host.docker.internal,host.internal

services:
  neko-db:
    image: ghcr.io/open-neko/neko-db:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: neko
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: neko
      PGDATA: /var/lib/postgresql/neko
    expose:
      - "5432"
    volumes:
      - neko-db-data:/var/lib/postgresql/neko
      - neko-db-socket:/var/run/postgresql
    command:
      - postgres
      - -c
      - wal_compression=on
      - -c
      - temp_file_limit=5GB
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U neko -d neko
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot storage ABI gate. It repairs persisted indexes in the managed
  # database after a libc/collation-runtime transition and records the
  # enforced contract independently of schema migrations. Every database
  # consumer waits for successful completion, so an incompatible image fails
  # closed before application reads or writes begin.
  storage-reconcile:
    image: ghcr.io/open-neko/neko-cli:${OPENNEKO_VERSION:-latest}
    restart: "no"
    command: ["storage", "reconcile"]
    depends_on:
      neko-db:
        condition: service_healthy
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      XDG_CONFIG_HOME: /config
    volumes:
      - openneko-config:/config/openneko






  # Customer-data GraphJin. Its endpoint is stored per organization and its
  # sources are configured to point at customer-owned databases/APIs. The
  # worker image carries the neutral seed so binary installs need no host file.
  graphjin-config-init:
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -f /config/agentic.yml ]; then
          cp /app/db/graphjin/customer.sources.example.yml /config/agentic.yml
          KEY=$$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')
          sed -i "s|REPLACE_WITH_BASE64_32_BYTE_KEY|$$KEY|" /config/agentic.yml
        fi
        # Refresh it unconditionally so existing persistent volumes self-heal.
        chown -R 1001:999 /config 2>/dev/null || true
        find /config -type d -exec chmod 0700 {} +
        find /config -type f -exec chmod 0600 {} +
    volumes:
      - openneko-graphjin-cli:/config
    restart: "no"

  # One-shot: resolves (or creates, under an advisory lock) the single org
  # row and reconciles the per-org JWT secret into the customer GraphJin
  # sources config BEFORE the server's first start. GraphJin 3.18 does not
  # hot-reload auth keys; expressing that as `openneko-serve -> worker` cycled
  # against the demo/dev overlays' `worker -> openneko-serve` edge, so this
  # one-shot carries the ordering instead. It reconciles unconditionally on
  # every run, so secret-key rotation, restores, and partial volume wipes
  # self-heal on the next stack start. Unlike the seeding inits it holds DB
  # credentials and reads the deployment secret-key, so it runs as the
  # image's non-root user rather than a root shell.
  graphjin-secret-init:
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    working_dir: /app
    # Guarded for supervisor/image version skew: the main-supervisor deploy
    # path pairs a supervisor (and this embedded compose) built from main
    # with application images from the latest smoked RELEASE, which may
    # predate the init script. Older images fall back to the worker's
    # boot-time reconcile — the pre-secret-init behavior every released
    # worker still carries — instead of failing the whole bring-up.
    command:
      - /bin/sh
      - -c
      - |
        SCRIPT=node_modules/@neko/llm/src/graphjin/init-secret.mjs
        if [ -f "$$SCRIPT" ]; then
          exec node --import tsx/esm "$$SCRIPT"
        fi
        echo "[graphjin-secret-init] image predates the embedded secret-init script; the worker reconciles the per-org JWT secret at boot instead"
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
      openneko-config-init:
        condition: service_completed_successfully
      graphjin-config-init:
        condition: service_completed_successfully
    environment:
      <<: *neko-app-env
      GRAPHJIN_SOURCES_CONFIG: /config/graphjin/agentic.yml
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
    restart: "no"

  # The customer GraphJin and the agent runtime in one process: `openneko
  # serve --path /config` serves GraphJin's HTTP API on :8080 as `graphjin
  # serve` did, and runs each agent turn web and the worker send over
  # /run/openneko/serve.sock. A turn asks GraphJin's agent in this process,
  # as the run's user, with no HTTP hop. Terminal commands go to
  # agent-sandbox. Model keys arrive only with each turn. Config changes
  # apply live through gj_config, so nothing restarts it. A second GraphJin
  # on :8089 serves the worker's workflow subscriptions from neko-db, as the
  # read-only neko_subscriptions role.
  openneko-serve:
    image: ${OPENNEKO_AGENT_IMAGE:-ghcr.io/open-neko/agent:${OPENNEKO_VERSION:-latest}}
    user: "1001:999"
    # Group 1001 shares the run folders and the serve socket with web,
    # worker and agent-sandbox.
    group_add: ["1001"]
    init: true
    entrypoint: ["openneko"]
    restart: unless-stopped
    depends_on:
      graphjin-config-init:
        condition: service_completed_successfully
      # The per-org JWT secret is reconciled into agentic.yml by the
      # graphjin-secret-init one-shot. GraphJin does not hot-reload auth
      # keys, so start only after that reconciliation has completed.
      graphjin-secret-init:
        condition: service_completed_successfully
      agent-sandbox:
        condition: service_started
    # `graphjin` was this service's name before it was renamed; the alias
    # keeps URLs saved with the old hostname working.
    networks:
      default:
        aliases: [graphjin]
    expose:
      - "8080"
      - "8089"
    environment:
      GO_ENV: agentic
      GRAPHJIN_AGENT_API_KEY: ${GRAPHJIN_AGENT_API_KEY:-}
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_SANDBOX_SOCKET: /run/openneko/sandbox.sock
      OPENNEKO_SUBSCRIPTIONS_DB: neko-db:5432/neko
    volumes:
      - openneko-graphjin-cli:/config
      - openneko-run:/run/openneko
      - openneko-agent-runs:/var/lib/openneko/agent-runs
    command: ["serve", "--path", "/config"]
    healthcheck:
      # JWT-protected GraphQL may return a non-2xx response to this anonymous
      # request; any HTTP response proves GraphJin is serving. The socket
      # proves the agent runtime is.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('fs').statSync('/run/openneko/serve.sock');const get=(u,next)=>require('http').get(u,next).on('error',()=>process.exit(1));get('http://127.0.0.1:8080/api/v1/graphql',()=>get('http://127.0.0.1:8089/api/v1/graphql',()=>process.exit(0)))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot: applies SQL migrations to neko-db after both database volumes
  # satisfy the enforced storage contract. Every long-running service depends
  # on this completing successfully, so schema and storage are ready together.
  # Lives in the tiny neko-cli image (just the OpenNeko binary + ca-certs).
  neko-migrate:
    image: ghcr.io/open-neko/neko-cli:${OPENNEKO_VERSION:-latest}
    restart: "no"
    command: ["migrate"]
    depends_on:
      neko-db:
        condition: service_healthy
      storage-reconcile:
        condition: service_completed_successfully
    # NEKO_PG_PASSWORD here is the bootstrap fallback only — once /setup
    # rotates the password the openneko CLI's defaultConn reads it from
    # /config/openneko/config.json on the shared volume. Without this volume
    # mount, re-`compose up` after rotation would fail with stale creds.
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      OPENNEKO_SKIP_MIGRATE: ${OPENNEKO_SKIP_MIGRATE:-}
      XDG_CONFIG_HOME: /config
    volumes:
      - openneko-config:/config/openneko

  # The migration CLI runs as root and may create the shared config directory
  # and secret key on first boot. Repair ownership before the non-root worker
  # mounts the volume so a completely fresh Compose project can start.
  openneko-config-init:
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /config/openneko
        chown -R 1001:1001 /config/openneko
        chmod 0700 /config/openneko
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
    volumes:
      - openneko-config:/config/openneko
    restart: "no"

  embedding:
    # The listener is always available; ONNX/model memory exists only on demand.
    image: ${OPENNEKO_EMBEDDING_IMAGE:-ghcr.io/open-neko/neko-embedding:${OPENNEKO_VERSION:-latest}}
    restart: unless-stopped
    environment:
      OPENNEKO_SERVICE_IDLE_TIMEOUT: ${OPENNEKO_EMBEDDING_IDLE_TIMEOUT:-5m}
    read_only: true
    cpus: ${OPENNEKO_EMBEDDING_CPUS:-1.0}
    mem_limit: ${OPENNEKO_EMBEDDING_MEMORY:-1g}
    pids_limit: 64
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    expose:
      - "5003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5003/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3

  # Runs terminal commands as a per-turn user (uid 20000 and up, group 1001)
  # in the run's staged workspace. It needs root to switch users, so every
  # other capability is dropped. It sits only on the agent-sandbox network:
  # commands can reach the internet but not neko-db, GraphJin,
  # the broker or any other service of this stack.
  agent-sandbox:
    image: ${OPENNEKO_AGENT_IMAGE:-ghcr.io/open-neko/agent:${OPENNEKO_VERSION:-latest}}
    user: "0:0"
    command: ["openneko", "sandbox", "--socket", "/run/openneko/sandbox.sock"]
    restart: unless-stopped
    environment:
      OPENNEKO_SANDBOX_WORKSPACES: /var/lib/openneko/agent-runs
      OPENNEKO_SANDBOX_HOMES: /var/lib/openneko/sandbox-homes
      OPENNEKO_SANDBOX_GID: "1001"
    volumes:
      - openneko-run:/run/openneko
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-sandbox-homes:/var/lib/openneko/sandbox-homes
    networks:
      - agent-sandbox
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024

  web:
    image: ghcr.io/open-neko/neko-web:${OPENNEKO_VERSION:-latest}
    depends_on:
      # Schema is guaranteed ready by neko-migrate before web boots — no
      # need for web's entrypoint to run migrate itself anymore.
      neko-migrate:
        condition: service_completed_successfully
      graphjin-secret-init:
        condition: service_completed_successfully
      # Web is the user-facing readiness boundary. Do not serve the temporary
      # recovery screen while the control plane is still starting.
      worker:
        condition: service_healthy
      openneko-serve:
        condition: service_healthy
    environment:
      <<: *neko-app-env
      WORKER_ADMIN_URL: http://worker:4100
      OPENNEKO_RESTART_WEB_ON_PASSWORD_CHANGE: "1"
      # Base URL for emailed sign-in links and OAuth callbacks. Set it to the
      # URL people open when the web port is behind a proxy or another host.
      OPENNEKO_PUBLIC_URL: ${OPENNEKO_PUBLIC_URL:-http://localhost:${OPENNEKO_PORT:-3000}}
      OPENNEKO_MAP_STYLE: ${OPENNEKO_MAP_STYLE:-}
      OPENNEKO_GRAPHJIN_URL: http://openneko-serve:8089
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      # The agent runtime: runs stage under OPENNEKO_AGENT_RUNS_DIR and the
      # runner (OPENNEKO_AGENT_ENTRY) talks to serve's socket in graphjin. The
      # runner is a child process, so it reaches the broker on loopback.
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      # serve hosts the customer GraphJin, so runs ask its agent in-process.
      OPENNEKO_SERVE_GRAPHJIN: "1"
      OPENNEKO_AGENT_RUNS_DIR: /var/lib/openneko/agent-runs
      OPENNEKO_AGENT_ENTRY: /opt/openneko-agent/entry.js
    ports:
      # Web is the intentional server boundary. Operators can restrict it to
      # loopback with OPENNEKO_WEB_BIND_ADDRESS=127.0.0.1 when desired.
      - "${OPENNEKO_WEB_BIND_ADDRESS:-0.0.0.0}:${OPENNEKO_PORT:-3000}:8080"
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-run:/run/openneko
      - openneko-agent-runs:/var/lib/openneko/agent-runs
    restart: unless-stopped

  worker:
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    depends_on:
      # Same as web: neko-migrate completes before worker starts, so the
      # entrypoint no longer runs migrate.
      neko-migrate:
        condition: service_completed_successfully
      openneko-config-init:
        condition: service_completed_successfully
      # Serializes first-boot bootstrap: secret-init is the sole first
      # creator of the org row and the deployment secret-key, so the worker
      # (and web, transitively) always reads the same identity it derived
      # the GraphJin secret from.
      graphjin-secret-init:
        condition: service_completed_successfully
      embedding:
        condition: service_healthy
      # The worker must patch the per-org JWT secret before customer GraphJin
      # starts; depending on the one-shot seed avoids a startup cycle.
      graphjin-config-init:
        condition: service_completed_successfully
      openneko-serve:
        condition: service_healthy
    environment:
      <<: *neko-app-env
      OPENNEKO_GRAPHJIN_URL: http://openneko-serve:8089
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      # The agent runtime: runs stage under OPENNEKO_AGENT_RUNS_DIR and the
      # runner (OPENNEKO_AGENT_ENTRY) talks to serve's socket in graphjin. The
      # runner is a child process, so it reaches the broker on loopback.
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      # serve hosts the customer GraphJin, so runs ask its agent in-process.
      OPENNEKO_SERVE_GRAPHJIN: "1"
      OPENNEKO_AGENT_RUNS_DIR: /var/lib/openneko/agent-runs
      OPENNEKO_AGENT_ENTRY: /opt/openneko-agent/entry.js
    expose:
      - "4100"
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-run:/run/openneko
      - openneko-agent-runs:/var/lib/openneko/agent-runs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  neko-db-data:
  neko-db-socket:
  openneko-config:
  openneko-graphjin-cli:
  openneko-agent-home:
  openneko-agent-tmp:
  # Agent runtime: sockets, staged run workspaces, per-run sandbox homes.
  openneko-run:
  openneko-agent-runs:
  openneko-sandbox-homes:

networks:
  # The sandbox's only network. Terminal commands reach the internet through
  # it and nothing else of the stack is attached.
  agent-sandbox:
