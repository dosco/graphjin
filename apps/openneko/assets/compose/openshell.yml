# OpenShell sandbox overlay (opt-in). Runs the agent's plugins — and, with the
# agent-runtime env, the agent itself — in OpenShell sandboxes via a
# containerised gateway with the Docker driver.
#
#   docker compose -f compose.yml -f compose.openshell.yml up
#
# STATUS: VALIDATED end-to-end on Linux and macOS/OrbStack. The containerised
# gateway boots with mTLS, the Docker driver creates a sandbox, the supervisor
# fetches policy + reaches Ready, exec runs, and default-deny egress is
# enforced. On macOS the host-side state path must live under $HOME; the
# `openneko` supervisor configures that automatically (see requirement #4).
#
# Hard requirements proven during bring-up:
#  1. Docker sandboxes REQUIRE mTLS (JWT + client-cert auth); --disable-tls is a
#     dead end. The certgen init generates the PKI.
#  2. Every path the gateway hands the host daemon as a bind-mount source (the
#     supervisor binary cache, the TLS dir, AND the per-sandbox JWT under HOME)
#     must exist at an IDENTICAL host:container path. One matched mount of the
#     whole state dir covers them; XDG_DATA_HOME / OPENSHELL_LOCAL_TLS_DIR / HOME
#     all point inside it.
#  3. The Docker supervisor uses host networking while the agent container
#     has no network. Its gateway callback uses host.openshell.internal mapped
#     to 127.0.0.1, where the gateway is published on loopback. The supervisor
#     can route to the Compose network's private data-service and broker IPs.
#  4. HOME MUST be a matched host-shared path (NOT /tmp). The gateway writes the
#     per-sandbox JWT under $HOME/.local/state/openshell/... and the driver
#     bind-mounts it to /etc/openshell/auth/sandbox.jwt in the sandbox — so the
#     host daemon must resolve the SAME path. HOME=/tmp (container-internal) →
#     empty bind-mount → the sandbox can't read its JWT and crash-loops.
#  5. The gateway image is DISTROLESS (no /bin/sh): certgen runs the binary
#     directly; the registration-writing is a separate busybox step.
#  6. Sandbox base images must include a `sandbox` user/group AND iproute2 (for
#     the egress netns). The plugin-base + agent images provide both.

services:
  # Generate the mTLS PKI (CA + server + client + JWT signing key). Distroless
  # image → run the binary directly. The state dir is mounted at an identical
  # path so generate-certs' temp-dir rename stays on one device (requirement #2).
  openshell-certgen:
    image: ghcr.io/nvidia/openshell/gateway:${OPENSHELL_VERSION:-0.1.2}
    restart: "no"
    user: "0:0"
    command:
      # Generates into a STAGING dir; openshell-reg promotes it to pki/ only
      # when no complete PKI is active. certgen re-runs on every `up`, and
      # rewriting the CA under a live gateway broke every issued client cert.
      - generate-certs
      - --output-dir
      - ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/pki-staging
      - --server-san
      - host.openshell.internal
      - --server-san
      - openshell-gateway
      - --server-san
      - 127.0.0.1
      - --server-san
      - localhost
    volumes:
      - ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}:${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}

  # Write the worker's CLI gateway registration and the gateway's Docker-driver
  # config. Split out of certgen because the gateway image has no shell
  # (requirement #5).
  openshell-reg:
    image: busybox:latest
    restart: "no"
    depends_on:
      openshell-certgen:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        PKI=${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/pki
        STAGING=${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/pki-staging
        # Promote certgen's staged PKI only when no complete set is active:
        # an existing CA always wins, so a hand-run `compose up` (which
        # re-runs the one-shots but not the unchanged gateway) can never
        # invalidate the material a live gateway already loaded.
        if [ ! -f "$$PKI/ca.crt" ] || [ ! -f "$$PKI/server/tls.key" ] || [ ! -f "$$PKI/client/tls.key" ]; then
          rm -rf "$$PKI"
          mv "$$STAGING" "$$PKI"
        elif [ -d "$$STAGING" ]; then
          rm -rf "$$STAGING"
        fi
        # web + worker have XDG_CONFIG_HOME=/config and the CLI reads gateway
        # registrations from $$XDG_CONFIG_HOME/openshell — so write to
        # /config/openshell (the shared openshell-config volume), NOT under the
        # openneko-config volume (which mounts at /config/openneko).
        REG=/config/openshell/gateways/openneko
        mkdir -p "$$REG/mtls"
        chmod a+rx /config/openshell /config/openshell/gateways "$$REG" "$$REG/mtls"
        # Per-file atomic publish: stage next to the destination with final
        # permissions, then rename(2) into place — every `openshell` CLI
        # spawn re-reads these files, and an in-place truncate-and-write
        # handed concurrent spawns truncated keys and half-written JSON.
        # active_gateway goes LAST: it is the pointer that makes the
        # registration live.
        pub() {
          tmp="$$2.tmp.$$$$"
          cp "$$1" "$$tmp"
          chmod a+r "$$tmp"
          mv "$$tmp" "$$2"
        }
        pub "$$PKI/ca.crt"         "$$REG/mtls/ca.crt"
        pub "$$PKI/client/tls.crt" "$$REG/mtls/tls.crt"
        pub "$$PKI/client/tls.key" "$$REG/mtls/tls.key"
        tmp="$$REG/metadata.json.tmp.$$$$"
        printf '{"name":"openneko","gateway_endpoint":"https://openshell-gateway:%s","is_remote":false,"gateway_port":0,"auth_mode":"mtls"}\n' "${OPENSHELL_PORT:-18080}" \
          > "$$tmp"
        chmod a+r "$$tmp"
        mv "$$tmp" "$$REG/metadata.json"
        tmp="/config/openshell/gateway.toml.tmp.$$$$"
        printf '[openshell]\nversion = 2\n\n[openshell.gateway]\ncompute_driver = "docker"\nguest_tls_ca = "%s/pki/ca.crt"\nguest_tls_cert = "%s/pki/client/tls.crt"\nguest_tls_key = "%s/pki/client/tls.key"\n\n[openshell.gateway.gateway_jwt]\nsigning_key_path = "%s/pki/jwt/signing.pem"\npublic_key_path = "%s/pki/jwt/public.pem"\nkid_path = "%s/pki/jwt/kid"\ngateway_id = "%s"\n\n[openshell.drivers.docker]\nsandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:%s"\nsupervisor_image = "%s"\nimage_pull_policy = "if_not_present"\nsandbox_label = "%s"\ngrpc_endpoint = "https://127.0.0.1:%s"\napp_armor_profile = "Unconfined"\n' \
          "${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}" "${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}" "${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}" \
          "${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}" "${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}" "${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}" \
          "$$OPENNEKO_COMPOSE_NETWORK" "${OPENSHELL_VERSION:-0.1.2}" "${OPENNEKO_SUPERVISOR_IMAGE:-ghcr.io/open-neko/openshell-supervisor:${OPENNEKO_VERSION:-latest}}" "$$OPENNEKO_COMPOSE_NETWORK" "${OPENSHELL_PORT:-18080}" \
          > "$$tmp"
        chmod a+r "$$tmp"
        mv "$$tmp" /config/openshell/gateway.toml
        tmp="/config/openshell/active_gateway.tmp.$$$$"
        printf 'openneko' > "$$tmp"
        chmod a+r "$$tmp"
        mv "$$tmp" /config/openshell/active_gateway
    environment:
      # `docker compose -p ...` supplies COMPOSE_PROJECT_NAME during
      # interpolation; the explicit name must match the runtime network below.
      OPENNEKO_COMPOSE_NETWORK: "${COMPOSE_PROJECT_NAME}_runtime"
      OPENSHELL_GATEWAY_IP: "${OPENSHELL_GATEWAY_IP:-172.29.0.2}"
    volumes:
      # Whole state dir read-write: reg promotes pki-staging -> pki.
      - ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}:${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}
      - openshell-config:/config/openshell

  # The OpenShell Docker driver can retain exited agent containers and their
  # unbounded JSON logs after a host restart. This socket-only service reaps
  # those containers promptly and removes old, unreferenced librarian digests.
  # It never removes a running container, a database volume, or a tagged image.
  neko-reaper:
    image: ghcr.io/open-neko/neko-cli:${OPENNEKO_VERSION:-latest}
    command: ["reaper"]
    environment:
      OPENNEKO_VERSION: ${OPENNEKO_VERSION:-latest}
      OPENNEKO_AGENT_IMAGE: ${OPENNEKO_AGENT_IMAGE:-}
      OPENSHELL_VERSION: ${OPENSHELL_VERSION:-0.1.2}
    restart: unless-stopped
    user: "0:0"
    network_mode: none
    read_only: true
    mem_limit: 128m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "/openneko", "reaper", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:${OPENSHELL_VERSION:-0.1.2}
    restart: unless-stopped
    user: "0:0"                       # needs the host docker.sock (use a socket-proxy in prod)
    command:
      - "--config"
      - "/config/openshell/gateway.toml"
      - "--bind-address"
      - "0.0.0.0"
      - "--port"
      - "${OPENSHELL_PORT:-18080}"
    depends_on:
      openshell-reg:
        condition: service_completed_successfully
      # This private one-shot also provisions the gateway's dedicated DB role.
      neko-migrate:
        condition: service_completed_successfully
    environment:
      OPENSHELL_DRIVERS: docker
      OPENSHELL_DB_URL: ${OPENSHELL_DB_URL:-postgres://neko:secret@neko-db:5432/neko}
      OPENSHELL_LOCAL_TLS_DIR: ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/pki
      OPENSHELL_TLS_CERT: ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/pki/server/tls.crt
      OPENSHELL_TLS_KEY: ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/pki/server/tls.key
      OPENSHELL_TLS_CLIENT_CA: ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/pki/ca.crt
      XDG_DATA_HOME: ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/cache
      # Matched, host-shared HOME (requirement #4) — NOT /tmp.
      HOME: ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}/home
    # CLI clients use the service name; sandbox callbacks use the stable
    # private address below. The host publish is loopback-only.
    ports:
      - "127.0.0.1:${OPENSHELL_PORT:-18080}:${OPENSHELL_PORT:-18080}"
    networks:
      default:
        ipv4_address: "${OPENSHELL_GATEWAY_IP:-172.29.0.2}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openshell-config:/config/openshell:ro
      # One matched mount of the whole state dir (pki + cache + home) so every
      # path the gateway hands the daemon resolves identically on the host.
      - ${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}:${OPENSHELL_STATE_DIR:-/var/lib/openneko/openshell}

  # A running gateway container is not yet a usable gateway: it still has to
  # finish its database migrations and bind the mTLS control plane. Probe a
  # real, read-only RPC before either app process is allowed to start. This
  # closes the fresh-install race where setup completed successfully but the
  # first profiler sandbox failed with "No active gateway"/connection errors.
  openshell-ready:
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    restart: "no"
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        attempt=0
        until openshell --gateway openneko provider list --names >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "OpenShell gateway did not become ready within 120 seconds" >&2
            openshell --gateway openneko provider list --names
            exit 1
          fi
          sleep 2
        done
        echo "OpenShell gateway ready"
    environment:
      HOME: /tmp/openneko-home
      XDG_CONFIG_HOME: /config
    volumes:
      - openshell-config:/config/openshell:ro
    depends_on:
      openshell-gateway:
        condition: service_started

  # Worker: channel-triggered agent runs + plugins, both in OpenShell sandboxes.
  worker:
    environment:
      OPENNEKO_SANDBOX_OWNER: openneko-worker
      OPENNEKO_PLUGIN_BASE_IMAGE: ${OPENNEKO_PLUGIN_BASE_IMAGE:-ghcr.io/open-neko/plugin-base:${OPENNEKO_VERSION:-latest}}
      OPENNEKO_AGENT_IMAGE: ${OPENNEKO_AGENT_IMAGE:-ghcr.io/open-neko/agent:${OPENNEKO_VERSION:-latest}}
      OPENNEKO_AGENT_CPUS: ${OPENNEKO_AGENT_CPUS:-2}
      OPENNEKO_AGENT_MEMORY: ${OPENNEKO_AGENT_MEMORY:-1Gi}
      # Provider / egress host / key-env are derived from the
      # org's model config by provisionHostConfig — no per-deploy egress wiring.
      OPENSHELL_GATEWAY: openneko
      # The host-networked supervisor routes to the broker's private Compose
      # IP; the sandbox workload itself has no direct network interface.
      OPENNEKO_SANDBOX_SHARED_NETWORK: "1"
      OPENNEKO_BROKER_PORT: ${OPENNEKO_WORKER_BROKER_PORT:-4199}
    expose:
      - "${OPENNEKO_WORKER_BROKER_PORT:-4199}"
    volumes:
      - openshell-config:/config/openshell
    depends_on:
      neko-reaper:
        condition: service_healthy
      openshell-ready:
        condition: service_completed_successfully
      # openshell-ready's exit-0 is a historical fact; the direct edge keeps
      # `up -d worker`/`up -d web` from starting an app process with no
      # gateway container at all.
      openshell-gateway:
        condition: service_started

  # Web: interactive chat launches the agent in a sandbox too (the Next.js server
  # is the control plane; the agent never runs in-process). Same flags; egress
  # self-derives on the first settings save (provisionHostConfig).
  web:
    environment:
      OPENNEKO_SANDBOX_OWNER: openneko-web
      OPENNEKO_AGENT_IMAGE: ${OPENNEKO_AGENT_IMAGE:-ghcr.io/open-neko/agent:${OPENNEKO_VERSION:-latest}}
      OPENNEKO_AGENT_CPUS: ${OPENNEKO_AGENT_CPUS:-2}
      OPENNEKO_AGENT_MEMORY: ${OPENNEKO_AGENT_MEMORY:-1Gi}
      OPENSHELL_GATEWAY: openneko
      OPENNEKO_SANDBOX_SHARED_NETWORK: "1"
      OPENNEKO_BROKER_PORT: ${OPENNEKO_WEB_BROKER_PORT:-4198}
    expose:
      - "${OPENNEKO_WEB_BROKER_PORT:-4198}"
    volumes:
      - openshell-config:/config/openshell
    depends_on:
      neko-reaper:
        condition: service_healthy
      openshell-ready:
        condition: service_completed_successfully
      # openshell-ready's exit-0 is a historical fact; the direct edge keeps
      # `up -d worker`/`up -d web` from starting an app process with no
      # gateway container at all.
      openshell-gateway:
        condition: service_started

volumes:
  # Holds the worker/web CLI's gateway registration at /config/openshell (the
  # certgen+reg step writes it; the gateway is reached by mTLS service name).
  openshell-config:

# Keep the runtime network and its addresses stable across upgrades and named
# installations. The gateway's mTLS port is published only on host loopback.
networks:
  default:
    name: "${COMPOSE_PROJECT_NAME}_runtime"
    ipam:
      config:
        - subnet: "${OPENNEKO_DOCKER_SUBNET:-172.29.0.0/24}"
          gateway: "${OPENNEKO_DOCKER_GATEWAY:-172.29.0.1}"
          # Keep dynamic service/sandbox allocation away from the gateway's
          # fixed .2 address (the CLI derives this range for custom subnets).
          ip_range: "${OPENNEKO_DOCKER_IP_RANGE:-172.29.0.128/25}"
