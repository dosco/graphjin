# macOS/local-dev OpenShell overlay. Reuses an already running host gateway
# instead of starting the Linux-only containerised gateway from
# compose.openshell.yml.
#
# Prerequisite: configure the host gateway's Docker driver with
# `network_name = "openneko-agentic_default"`, then start it. That attaches
# sandboxes to this Compose network instead of publishing broker ports.
#
# Usage (alongside the agentic GraphJin overlay):
#   OPENNEKO_PORT=3000 GRAPHJIN_AGENT_API_KEY=... \
#   GRAPHJIN_AGENT_PROVIDER=google-gemini \
#   GRAPHJIN_AGENT_MODEL=gemini-3.8-flash \
#   docker compose -p openneko-agentic \
#     -f compose.yml -f compose.adventureworks.yml \
#     -f compose.graphjin-agent.yml -f compose.openshell-host.yml up -d --build
#
# The init service copies only the gateway's mTLS client material. The host
# gateway remains bound to loopback; Docker reaches it through the host alias
# covered by OpenShell's generated server certificate.
services:
  openshell-host-reg:
    image: busybox:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        SRC=/host-mtls
        REG=/config/openshell/gateways/openneko-host
        test -s "$$SRC/ca.crt"
        test -s "$$SRC/tls.crt"
        test -s "$$SRC/tls.key"
        mkdir -p "$$REG/mtls"
        cp "$$SRC/ca.crt" "$$REG/mtls/ca.crt"
        cp "$$SRC/tls.crt" "$$REG/mtls/tls.crt"
        cp "$$SRC/tls.key" "$$REG/mtls/tls.key"
        printf '{"name":"openneko-host","gateway_endpoint":"https://host.docker.internal:%s","is_remote":false,"gateway_port":0,"auth_mode":"mtls"}\n' "${OPENSHELL_HOST_PORT:-17670}" \
          > "$$REG/metadata.json"
        printf 'openneko-host' > /config/openshell/active_gateway
        chown -R 1001:999 /config/openshell
        find /config/openshell -type d -exec chmod 700 {} +
        find /config/openshell -type f -exec chmod 600 {} +
    volumes:
      - ${HOME}/.config/openshell/gateways/${OPENSHELL_HOST_GATEWAY:-openshell}/mtls:/host-mtls:ro
      - openshell-host-config:/config/openshell

  worker:
    environment:
      OPENNEKO_AGENT_IMAGE: ${OPENNEKO_AGENT_IMAGE:-ghcr.io/open-neko/agent:${OPENNEKO_VERSION:-latest}}
      OPENNEKO_AGENT_CPUS: ${OPENNEKO_AGENT_CPUS:-2}
      OPENNEKO_AGENT_MEMORY: ${OPENNEKO_AGENT_MEMORY:-1Gi}
      OPENSHELL_GATEWAY: openneko-host
      OPENNEKO_SANDBOX_SHARED_NETWORK: "1"
      OPENNEKO_BROKER_PORT: ${OPENNEKO_WORKER_BROKER_PORT:-4199}
    expose:
      - "${OPENNEKO_WORKER_BROKER_PORT:-4199}"
    volumes:
      - openshell-host-config:/config/openshell
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      openshell-host-reg:
        condition: service_completed_successfully

  web:
    environment:
      OPENNEKO_AGENT_IMAGE: ${OPENNEKO_AGENT_IMAGE:-ghcr.io/open-neko/agent:${OPENNEKO_VERSION:-latest}}
      OPENNEKO_AGENT_CPUS: ${OPENNEKO_AGENT_CPUS:-2}
      OPENNEKO_AGENT_MEMORY: ${OPENNEKO_AGENT_MEMORY:-1Gi}
      OPENSHELL_GATEWAY: openneko-host
      OPENNEKO_SANDBOX_SHARED_NETWORK: "1"
      OPENNEKO_BROKER_PORT: ${OPENNEKO_WEB_BROKER_PORT:-4198}
    expose:
      - "${OPENNEKO_WEB_BROKER_PORT:-4198}"
    volumes:
      - openshell-host-config:/config/openshell
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      openshell-host-reg:
        condition: service_completed_successfully

volumes:
  openshell-host-config:
